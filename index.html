<title>Dream Sandwich — Business Manager</title>
<style>
:root{
  --bg:#f7f8f9; --card:#ffffff;
  --line:#e5e7eb; --line2:#f1f2f4;
  --ink:#1D0200; --ink2:#4b5563; --muted:#9ca3af;
  --accent:#1D0200; --soft:#f3f4f6;
  --pos:#067647; --pos-bg:#f0f9f4;
  --neg:#b42318; --neg-bg:#fef3f2;
  --amber:#b54708; --amber-bg:#fffaeb;
  --teal:#0f766e; --teal-bg:#f0fdfa;
  --indigo:#3730a3; --indigo-bg:#eef2ff;
  --radius:10px;
  --shadow:0 1px 2px rgba(16,24,40,.04);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;max-width:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,a,input,select,textarea,label{touch-action:manipulation}
button,a{-webkit-appearance:none;appearance:none}
img,svg{max-width:100%}
:focus-visible{outline:2px solid #6b7280;outline-offset:2px}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--ink); font-size:13.5px; line-height:1.5;
  -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums;
}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
p{margin:0}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13.5px;color:var(--ink)}
::selection{background:#e5e7eb}

/* ---------------- LAYOUT ---------------- */
.app{display:flex;min-height:100vh}
.sidebar{
  width:224px;flex:0 0 224px;background:#fff;border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;gap:10px;align-items:center;padding:16px 14px;border-bottom:1px solid var(--line2)}

.brand-name{font-weight:600;font-size:13.5px;line-height:1.2}
.brand-sub{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.nav{padding:10px 8px;flex:1}
.nav-group{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 8px 6px;font-weight:600}
.nav-item{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:transparent;
  color:var(--ink2);padding:8px 10px;border-radius:8px;font-size:13px;transition:background .12s;position:relative;
}
.nav-item:hover{background:var(--soft);color:var(--ink)}
.nav-item.active{background:var(--soft);color:var(--ink);font-weight:600}
.nav-item.active:before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--ink)}
.nav-item svg{width:16px;height:16px;flex:0 0 16px;opacity:.6}
.nav-item.active svg{opacity:1}
.nav-badge{margin-left:auto;background:var(--neg-bg);color:var(--neg);font-size:10px;font-weight:600;padding:1px 6px;border-radius:20px}
.side-foot{padding:12px 14px;border-top:1px solid var(--line2);font-size:11px;color:var(--muted);line-height:1.5}
.side-foot b{color:var(--ink2);font-weight:600}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);
  padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.hamburger{display:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 9px;font-size:15px;line-height:1}
.company h1{font-size:14.5px;line-height:1.2;font-weight:600}
.company p{font-size:11.5px;color:var(--muted);margin-top:1px}
.spacer{flex:1}
.period{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;padding:2px 4px;background:#fff}
.period select,.period input{border:0;background:transparent;font-size:12px;padding:4px 4px;border-radius:6px;color:var(--ink2);max-width:126px}
.period input[type=date]{font-size:11.5px;color:var(--muted)}
.period select:focus,.period input:focus{outline:2px solid var(--soft)}
.quick{display:flex;gap:6px}
.view{padding:22px 24px 60px;max-width:1440px;width:100%;margin:0 auto}

/* ---------------- TABS ---------------- */
.tabsbar{display:flex;align-items:center;gap:18px;border-bottom:1px solid var(--line);margin:-4px 0 18px;overflow-x:auto}
.tabsbar .tab{
  border:0;background:transparent;padding:9px 1px 10px;font-size:12.8px;font-weight:500;color:var(--muted);
  border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;
}
.tabsbar .tab:hover{color:var(--ink2)}
.tabsbar .tab.active{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.tabs{display:flex;gap:4px;background:var(--soft);padding:3px;border-radius:8px}
.tab{border:0;background:transparent;padding:5px 11px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--ink2)}
.tab.active{background:#fff;color:var(--ink);font-weight:600;box-shadow:var(--shadow)}

/* ---------------- BUTTONS ---------------- */
.btn{
  border:1px solid var(--line);background:#fff;color:var(--ink2);padding:7px 12px;border-radius:8px;
  font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:.12s;white-space:nowrap;
}
.btn:hover{border-color:#d1d5db;color:var(--ink);background:#fcfcfd}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:#3A1108;color:#fff}
.btn.gold{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.gold:hover{background:#000}
.btn.danger{color:var(--neg);border-color:#f1d4d1;background:#fff}
.btn.danger:hover{background:var(--neg-bg)}
.btn.sm{padding:4px 8px;font-size:11.5px;border-radius:6px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------------- CARDS ---------------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.card-head h3{font-size:13px;font-weight:600}
.card-head .sub{font-size:11.5px;color:var(--muted);margin-top:1px}
.card-body{padding:14px 16px}
.card-body.tight{padding:0}
.grid{display:grid;gap:14px}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cols-2-1{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.cols-1-2{grid-template-columns:minmax(0,1fr) minmax(0,1.7fr)}
.mb{margin-bottom:14px}
.mt{margin-top:14px}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 10px;flex-wrap:wrap}
.section-title h2{font-size:14px;font-weight:600}
.section-title .sub{font-size:11.5px;color:var(--muted);margin-top:1px}

/* ---------------- KPI ---------------- */
.tile{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;box-shadow:var(--shadow)}
.tile .label{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tile .val{font-size:21px;font-weight:600;letter-spacing:-.02em;margin-top:4px}
.tile .foot{font-size:11.5px;color:var(--muted);margin-top:5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tile.t-green .val{color:var(--pos)} .tile.t-red .val{color:var(--neg)}

.pos{color:var(--pos);font-weight:600}
.neg{color:var(--neg);font-weight:600}
.muted{color:var(--muted)}
.tiny{font-size:11px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
.num{text-align:right;white-space:nowrap}
.center{text-align:center}

/* ---------------- BADGES ---------------- */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--soft);color:var(--ink2);white-space:nowrap}
.b-green{background:var(--pos-bg);color:var(--pos)}
.b-red{background:var(--neg-bg);color:var(--neg)}
.b-amber{background:var(--amber-bg);color:var(--amber)}
.b-teal{background:var(--teal-bg);color:var(--teal)}
.b-indigo{background:var(--indigo-bg);color:var(--indigo)}
.b-grey{background:var(--soft);color:var(--ink2)}
.b-navy{background:var(--soft);color:var(--ink)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--muted)}
.dot.bakery{background:#c2872e} .dot.store{background:#3f8f88} .dot.supply{background:#5b5bd6} .dot.common{background:var(--muted)}

/* ---------------- TABLES ---------------- */
.tbl-wrap{overflow:auto;max-height:72vh}
table.tbl{width:100%;border-collapse:collapse;font-size:12.8px}
table.tbl th{
  text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;
  background:#fff;padding:9px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2;white-space:nowrap;
}
table.tbl td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.tbl tbody tr:hover{background:#fcfcfd}
table.tbl tfoot td{background:#fafafa;font-weight:600;border-top:1px solid var(--line)}
table.tbl.compact td,table.tbl.compact th{padding:7px 10px}
table.tbl .right,table.tbl th.right{text-align:right}
tr.hl-green td{background:#f7fdfa}
tr.hl-red td{background:#fffbfa}
.empty{padding:32px 16px;text-align:center;color:var(--muted);font-size:12.5px}
.empty b{display:block;color:var(--ink2);margin-bottom:2px;font-weight:600}

/* ---------------- BARS ---------------- */
.bar{height:5px;background:var(--line2);border-radius:20px;overflow:hidden}
.bar > i{display:block;height:100%;border-radius:20px;background:#1D0200}
.bar.g > i{background:#4d9e7a}
.bar.r > i{background:#c97069}
.bar.a > i{background:#c2a04b}
.tracker{display:flex;gap:2px;height:5px;border-radius:20px;overflow:hidden;background:var(--line2)}
.tracker i{display:block;height:100%}

/* ---------------- VERTICAL CARD ---------------- */
.vcard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.vcard .vh{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line2)}
.vcard .vh h4{font-size:12.5px;font-weight:600}
.vcard .vb{padding:12px 14px}
.vrow{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:12.5px}
.vrow .k{color:var(--ink2)}
.vrow .v{font-weight:500}
.vrow.total{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:600}
.vrow.total .v{font-weight:600}

/* ---------------- MODAL ---------------- */
#modalRoot:empty{display:none}
.modal-back{position:fixed;inset:0;background:rgba(17,24,39,.34);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:28px 14px;overflow-y:auto}
.modal{background:#fff;border-radius:12px;box-shadow:0 24px 60px -24px rgba(16,24,40,.4);width:100%;max-width:720px;margin:auto;animation:pop .14s ease-out}
@keyframes pop{from{transform:translateY(6px);opacity:.7}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:flex-start;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line2)}
.modal-head h3{font-size:14px}
.modal-head .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.modal-head .x{margin-left:auto;border:0;background:var(--soft);border-radius:8px;width:28px;height:28px;font-size:14px;color:var(--ink2)}
.modal-body{padding:16px 18px}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line2);background:#fcfcfd;border-radius:0 0 12px 12px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:11px 14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{
  border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:#fff;width:100%;transition:.12s;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:0;border-color:#9ca3af;box-shadow:0 0 0 3px var(--soft)}
.field .hint{font-size:10.5px;color:var(--muted)}
.field.gold input,.field.gold select{background:#fffdf7;border-color:#eee3c4}
.check{display:flex;align-items:center;gap:7px;font-size:12.5px;padding-top:4px}
.check input{width:auto}
.formula{background:#fafafa;border:1px solid var(--line);border-radius:8px;padding:11px 13px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;line-height:1.8;color:var(--ink2);overflow-x:auto}
.formula b{color:var(--ink);font-weight:600}
.formula .w{color:var(--muted)}
.calcbox{background:#fafafa;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:12px}
.calcbox .cr{display:flex;justify-content:space-between;font-size:12.3px;padding:2px 0;gap:12px}
.calcbox .cr.big{border-top:1px solid var(--line);margin-top:5px;padding-top:7px;font-weight:600}
.linegrid{display:grid;grid-template-columns:2.1fr .85fr .85fr 1fr 26px;gap:6px;align-items:end;margin-bottom:6px}
.lines-head{display:grid;grid-template-columns:2.1fr .85fr .85fr 1fr 26px;gap:6px;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px}
.x-btn{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:6px;height:33px;width:26px;font-size:13px;line-height:1}
.x-btn:hover{color:var(--neg);border-color:#f1d4d1}

/* ---------------- TOAST ---------------- */
#toastRoot{position:fixed;bottom:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--ink);color:#fff;padding:9px 14px;border-radius:8px;font-size:12.5px;box-shadow:0 12px 26px -12px rgba(16,24,40,.5);animation:slide .18s ease-out;max-width:320px}
.toast.ok{background:#0b6b45} .toast.err{background:#8f1f1f} .toast.warn{background:#8a5a08}
@keyframes slide{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

/* ---------------- MISC ---------------- */
.alert{display:flex;gap:9px;align-items:flex-start;padding:8px 10px;border-radius:8px;background:#fcfcfd;border:1px solid var(--line);font-size:12.3px;margin-bottom:7px}
.alert.red{background:var(--neg-bg);border-color:#f6dcd9}
.alert .ic{font-size:13px;line-height:1.3}
.chartbox{width:100%;overflow-x:auto}
.chartbox svg{display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);padding:2px 4px}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px}
.rep-title{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.rep-title h2{font-size:16px;font-weight:600}
.rep-title p{font-size:12px;color:var(--muted);margin-top:2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:12.5px}
.kv .k{color:var(--muted)}
.hr{height:1px;background:var(--line2);margin:12px 0}
.tag-inline{font-size:10.5px;background:var(--soft);color:var(--ink2);padding:1px 6px;border-radius:5px}

/* ---------------- BAHI KHATA ---------------- */
.bk{display:grid;grid-template-columns:296px minmax(0,1fr);gap:16px;align-items:start}
.bk-list{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.bk-search{padding:10px;border-bottom:1px solid var(--line2)}
.bk-search input{width:100%;border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:12.5px}
.bk-scroll{max-height:calc(100vh - 230px);overflow-y:auto;padding:6px 0 10px}
.bk-group{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px 4px}
.acct{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;padding:6.5px 12px;font-size:12.6px;color:var(--ink2);border-left:2px solid transparent}
.acct:hover{background:#fcfcfd;color:var(--ink)}
.acct.active{background:var(--soft);color:var(--ink);font-weight:600;border-left-color:var(--ink)}
.acct .acct-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct .acct-bal{font-size:11.5px;color:var(--muted);font-weight:500}
.acct.active .acct-bal{color:var(--ink2)}
.ledger-head{padding:14px 18px;border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}
.ledger-head h3{font-size:14.5px}
.ledger-head .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.ledger-sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:12px 18px;border-bottom:1px solid var(--line2);background:#fcfcfd}
.ledger-sum div span{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ledger-sum div b{font-size:14px;font-weight:600}
table.ledger{width:100%;border-collapse:collapse;font-size:12.6px}
table.ledger th{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:2}
table.ledger td{padding:8px 12px;border-bottom:1px solid var(--line2)}
table.ledger tr:hover td{background:#fcfcfd}
table.ledger td.drcr{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.ledger tr.opening td{background:#fafafa;font-weight:600;color:var(--ink2)}
table.ledger tr.closing td{background:#fafafa;font-weight:600;border-top:1px solid var(--line)}
.drcr-tag{font-size:10.5px;color:var(--muted);margin-left:3px}
.bk-total{display:flex;justify-content:flex-end;gap:26px;padding:11px 18px;border-top:1px solid var(--line);font-size:12.5px;background:#fafafa}
.bk-total b{font-weight:600}

/* ---------------- PRINT ---------------- */
#printArea{display:none}
@media print{
  body{background:#fff;font-size:11px}
  .app,.topbar,.sidebar,#modalRoot,#toastRoot,.scrim{display:none !important}
  #printArea{display:block !important}
  #printArea .btn,#printArea input{display:none !important}
  #printArea .card{box-shadow:none;border:1px solid #dbe2ea;break-inside:avoid}
  #printArea .tbl-wrap{max-height:none;overflow:visible}
  #printArea table.tbl th,#printArea table.ledger th{background:#f3f4f6 !important;position:static}
  #printArea .kpis{grid-template-columns:repeat(4,1fr)}
  @page{size:A4;margin:12mm}
}
.inv{font-family:-apple-system,"Segoe UI",Arial,sans-serif;color:#111;max-width:820px;margin:0 auto;font-size:11.5px}
.inv h1{font-size:18px;font-weight:600}
.inv .ihead{display:flex;justify-content:space-between;gap:20px;border-bottom:1.5px solid #111;padding-bottom:10px}
.inv .ihead .right{text-align:right;font-size:11px;line-height:1.7}
.inv table{width:100%;border-collapse:collapse;margin-top:12px;font-size:11px}
.inv th{background:#f3f4f6;border:1px solid #e5e7eb;padding:6px 8px;text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em}
.inv td{border:1px solid #e5e7eb;padding:5.5px 8px}
.inv .tot{text-align:right;margin-top:10px;font-size:11.5px}
.inv .tot div{display:flex;justify-content:space-between;gap:40px;padding:2.5px 0;margin-left:auto;max-width:290px}
.inv .tot .gr{border-top:1.5px solid #111;margin-top:5px;padding-top:6px;font-weight:600;font-size:12.5px}
.inv .foot{margin-top:18px;display:flex;justify-content:space-between;font-size:10px;color:#444}
.inv .words{margin-top:8px;font-size:10.5px;background:#fafafa;border:1px dashed #d1d5db;padding:6px 9px;border-radius:4px}

/* ---------------- RESPONSIVE ---------------- */
@media (max-width:1180px){ .cols-2-1,.cols-1-2{grid-template-columns:1fr} .bk{grid-template-columns:1fr} .bk-scroll{max-height:260px} }
@media (max-width:1000px){
  .sidebar{position:fixed;left:0;top:0;z-index:90;transform:translateX(-102%);transition:.18s;box-shadow:20px 0 40px -24px rgba(0,0,0,.3)}
  .sidebar.open{transform:none}
  .hamburger{display:inline-flex}
  .cols-2,.cols-3{grid-template-columns:1fr}
  .view{padding:16px}
  .period{order:5}
  .ledger-sum{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:640px){
  .fields{grid-template-columns:1fr}
  .linegrid,.lines-head{grid-template-columns:1.6fr .8fr .8fr 1fr 26px}
  .quick .btn{padding:6px 8px;font-size:11.5px}
}

/* ---------------- DEVICE / OS HARDENING (mobile, tablet, iOS, Android, desktop) --------------- */
.app{min-height:100vh;min-height:100dvh}
.sidebar{height:100vh;height:100dvh;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.scrim{
  position:fixed;inset:0;background:rgba(17,24,39,.38);z-index:89;opacity:0;pointer-events:none;
  transition:opacity .18s ease;-webkit-backdrop-filter:blur(1px);backdrop-filter:blur(1px);
}
.scrim.show{opacity:1;pointer-events:auto}
@media (min-width:1001px){.scrim{display:none !important}}
body.nav-open{overflow:hidden;touch-action:none}
.nav-item span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar{padding-top:max(10px,env(safe-area-inset-top))}
.side-foot{padding-bottom:max(12px,env(safe-area-inset-bottom))}
.view{padding-bottom:max(60px,calc(30px + env(safe-area-inset-bottom)))}
#toastRoot{bottom:calc(18px + env(safe-area-inset-bottom));right:calc(18px + env(safe-area-inset-right))}
.modal-foot{padding-bottom:max(12px,calc(12px + env(safe-area-inset-bottom)))}
.tbl-wrap{overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.tabsbar{overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabsbar::-webkit-scrollbar{height:0}
.modal-back{overscroll-behavior:contain}
@media (hover:hover){ .tbl-wrap::-webkit-scrollbar{height:9px;width:9px} .tbl-wrap::-webkit-scrollbar-thumb{background:#d5d9de;border-radius:9px} .tbl-wrap::-webkit-scrollbar-track{background:transparent} }

/* iOS Safari: 16px se chhota font input pe auto-zoom karta hai */
@supports (-webkit-touch-callout:none){
  .field input,.field select,.field textarea,.bk-search input,.period select,.period input{font-size:16px}
  .field label,.lines-head{font-size:11px}
}

/* touch devices: bade tap targets */
@media (pointer:coarse){
  .btn{min-height:40px;padding:9px 13px}
  .btn.sm{min-height:34px;padding:6px 10px}
  .nav-item{padding:12px 12px;font-size:13.5px}
  .tab{padding:8px 12px}
  .x-btn{height:40px;width:34px}
  .modal-head .x{width:36px;height:36px;font-size:16px}
  .field input,.field select,.field textarea{padding:10px 11px}
  table.tbl td,table.tbl th{padding:10px 11px}
  .acct{padding:10px 12px}
  select,input[type=date]{min-height:40px}
}

/* mobile drawer: bada, scrollable, notch-safe */
@media (max-width:1000px){
  .sidebar{width:min(84vw,300px);flex:none;border-right:1px solid var(--line);z-index:90;will-change:transform}
  .sidebar.open{box-shadow:0 0 0 1px rgba(17,24,39,.06),24px 0 50px -28px rgba(0,0,0,.45)}
  .hamburger{width:40px;height:40px;justify-content:center;align-items:center;font-size:17px;flex:0 0 40px}
  .topbar{padding-left:14px;padding-right:14px;gap:10px}
  .view{padding:14px 14px 56px}
  .modal-back{padding:18px 12px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
  .ledger-sum{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bk-scroll{max-height:none}
}

@media (max-width:700px){
  .modal-back{padding:0;align-items:stretch}
  .modal{max-width:100% !important;min-height:100%;border-radius:0;display:flex;flex-direction:column}
  .modal-head{border-radius:0;position:sticky;top:0;background:#fff;z-index:3;padding-top:max(14px,env(safe-area-inset-top))}
  .modal-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .modal-foot{border-radius:0;position:sticky;bottom:0;z-index:3}
  .modal-foot .btn{flex:1;justify-content:center}
  .fields{grid-template-columns:1fr}
  .linegrid,.lines-head{grid-template-columns:1.5fr .7fr .7fr .9fr 30px;gap:5px}
  .linegrid input,.linegrid select{padding:8px 7px;font-size:13px}
  .rep-title{margin-bottom:12px}
  .rep-title h2{font-size:15.5px}
  table.tbl{font-size:12.3px}
  .inv{font-size:11px}

<script>
/* ================= DREAM SANDWICH — CORE UTILS ================= */
'use strict';

/* ---- safe storage (sandboxed preview me localStorage block ho sakta hai) ---- */
const LS = (() => {
  try {
    localStorage.setItem('__ds_test', '1');
    localStorage.removeItem('__ds_test');
    return localStorage;
  } catch (e) {
    const mem = {};
    return {
      getItem: k => (k in mem ? mem[k] : null),
      setItem: (k, v) => { mem[k] = String(v); },
      removeItem: k => { delete mem[k]; },
      __memory: true
    };
  }
})();
const STORE_KEY = 'dream_sandwich_v2';

/* ---- tiny DOM helpers ---- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---- numbers / money ---- */
const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
const r3 = n => Math.round((Number(n) || 0) * 1000) / 1000;
const INR = n => '₹' + r2(n).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const INR0 = n => '₹' + Math.round(Number(n) || 0).toLocaleString('en-IN');
const money = n => { n = r2(n); return (n < 0 ? '-₹' : '₹') + Math.abs(n).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
const QTY = n => { const v = r3(n); return v.toLocaleString('en-IN', { maximumFractionDigits: 3 }); };
const PCT = n => (Number(n) || 0).toFixed(1) + '%';
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));

/* ---- dates (local, no UTC shift) ---- */
const iso = d => {
  const x = new Date(d);
  return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
};
const TODAY = iso(new Date());
const dmy = s => { if (!s) return ''; const [y, m, d] = String(s).slice(0, 10).split('-'); return d + '-' + m + '-' + y; };
const dmyShort = s => { if (!s) return ''; const [y, m, d] = String(s).slice(0, 10).split('-'); return d + '/' + m; };
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const DAYN = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const weekday = s => DAYN[new Date(s + 'T00:00:00').getDay()];
const monthKey = s => String(s).slice(0, 7);
const monthName = s => { const [y, m] = String(s).slice(0, 7).split('-'); return MON[+m - 1] + ' ' + y; };
const addDays = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return iso(d); };
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
const startOfMonth = s => String(s).slice(0, 7) + '-01';
const endOfMonth = s => { const [y, m] = String(s).split('-').map(Number); return iso(new Date(y, m, 0)); };
const fyOf = s => { const [y, m] = String(s).split('-').map(Number); return m >= 4 ? y + '-' + String((y + 1) % 100).padStart(2, '0') : (y - 1) + '-' + String(y % 100).padStart(2, '0'); };
const fyStart = s => { const [y, m] = String(s).split('-').map(Number); return (m >= 4 ? y : y - 1) + '-04-01'; };

/* ---- ids ---- */
let _idc = 0;
const uid = p => (p || 'x') + '_' + Date.now().toString(36).slice(-5) + (_idc++).toString(36);

/* ---- SAFE FORMULA EVALUATOR (Tally-jaisa chhota formula engine) ----
   Support: + - * / ( ) numbers, aur variables (base, yq, qty, rate, cost).
   "12%" ka matlab base ka 12% (sirf percent-only expression).          */
function evalExpr(expr, vars) {
  vars = vars || {};
  if (typeof expr === 'number') return isFinite(expr) ? expr : 0;
  if (expr == null) return 0;
  let s = String(expr).trim();
  if (!s) return 0;
  const pctOnly = s.match(/^(\d*\.?\d+)\s*%$/);
  if (pctOnly) return (Number(vars.base) || 0) * Number(pctOnly[1]) / 100;
  s = s.replace(/,/g, '').replace(/₹/g, '');
  if (/^-?\d*\.?\d+$/.test(s)) return parseFloat(s);
  if (!/^[0-9a-zA-Z_+\-*/().\s]+$/.test(s)) return 0;
  let t = s.replace(/[a-zA-Z_][a-zA-Z0-9_]*/g, m => {
    if (vars[m] !== undefined && vars[m] !== null && vars[m] !== '') return '(' + (Number(vars[m]) || 0) + ')';
    return '(0)';
  });
  try {
    const v = Function('"use strict";return (' + t + ');')();
    return isFinite(v) ? v : 0;
  } catch (e) { return 0; }
}
const num = (v, vars) => evalExpr(v, vars);

/* ---- amount in words (Indian) ---- */
function inWords(amount) {
  const a = Math.round(Math.abs(Number(amount) || 0));
  if (a === 0) return 'Zero Rupaye';
  const ones = ['', 'Ek', 'Do', 'Teen', 'Chaar', 'Paanch', 'Chhah', 'Saat', 'Aath', 'Nau', 'Das', 'Gyarah', 'Barah', 'Terah', 'Chaudah', 'Pandrah', 'Solah', 'Satrah', 'Atharah', 'Unnis'];
  const tens = ['', '', 'Bees', 'Tees', 'Chalees', 'Pachas', 'Saath', 'Sattar', 'Assi', 'Nabbe'];
  const two = n => n < 20 ? ones[n] : tens[Math.floor(n / 10)] + (n % 10 ? ' ' + ones[n % 10] : '');
  const three = n => { const h = Math.floor(n / 100), rest = n % 100; return (h ? ones[h] + ' Sau' + (rest ? ' ' : '') : '') + (rest ? two(rest) : ''); };
  let out = '';
  const cr = Math.floor(a / 10000000), lk = Math.floor((a % 10000000) / 100000), th = Math.floor((a % 100000) / 1000), rest = a % 1000;
  if (cr) out += three(cr) + ' Crore ';
  if (lk) out += three(lk) + ' Lakh ';
  if (th) out += three(th) + ' Hazaar ';
  if (rest) out += three(rest);
  return out.trim() + ' Rupaye';
}

/* ---- toast ---- */
function toast(msg, type) {
  const t = document.createElement('div');
  t.className = 'toast ' + (type || '');
  t.textContent = msg;
  $('#toastRoot').appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = '.3s'; setTimeout(() => t.remove(), 320); }, 2600);
}

/* ---- generic form modal ---- */
function fieldHTML(f, values) {
  const v = values[f.key] !== undefined && values[f.key] !== null ? values[f.key] : (f.value !== undefined ? f.value : '');
  const cls = 'field' + (f.full ? ' full' : '') + (f.gold ? ' gold' : '');
  let inner;
  if (f.type === 'select') {
    inner = '<select name="' + f.key + '"' + (f.attrs || '') + '>' +
      (f.options || []).map(o => {
        const val = typeof o === 'object' ? o.value : o;
        const lab = typeof o === 'object' ? o.label : o;
        return '<option value="' + esc(val) + '"' + (String(val) === String(v) ? ' selected' : '') + '>' + esc(lab) + '</option>';
      }).join('') + '</select>';
  } else if (f.type === 'textarea') {
    inner = '<textarea name="' + f.key + '" rows="' + (f.rows || 2) + '" placeholder="' + esc(f.placeholder || '') + '">' + esc(v) + '</textarea>';
  } else if (f.type === 'check') {
    return '<div class="' + cls + '"><label class="check"><input type="checkbox" name="' + f.key + '" value="1"' + (v ? ' checked' : '') + '> ' + esc(f.label) + '</label>' + (f.hint ? '<div class="hint">' + esc(f.hint) + '</div>' : '') + '</div>';
  } else {
    /* mobile keyboard: number wale field pe numeric keypad */
    const numLabel = /₹|amount|price|rate|qty|qty|days|month|stock|%|pct|cost|limit|emi|tenure|opening|disc|salary|hours|gst/i.test(f.label || '');
    const im = f.inputmode || (f.type === 'number' || (f.type !== 'date' && numLabel) ? 'decimal' : '');
    inner = '<input type="' + (f.type || 'text') + '" name="' + f.key + '" value="' + esc(v) + '"' +
      (f.step ? ' step="' + f.step + '"' : (f.type === 'number' ? ' step="any"' : '')) +
      (im ? ' inputmode="' + im + '"' : '') +
      (f.type === 'email' ? ' autocapitalize="off" autocomplete="email"' : '') +
      (f.placeholder ? ' placeholder="' + esc(f.placeholder) + '"' : '') +
      (f.attrs || '') + '>';
  }
  return '<div class="' + cls + '"><label>' + esc(f.label) + '</label>' + inner + (f.hint ? '<div class="hint">' + esc(f.hint) + '</div>' : '') + '</div>';
}

function closeModal() { $('#modalRoot').innerHTML = ''; }

/* mobile keyboard: numeric fields pe number pad */
function upgradeInputs(root) {
  try {
    const scope = root || document;
    const list = scope.querySelectorAll ? scope.querySelectorAll('input[type=text],input:not([type])') : [];
    Array.prototype.forEach.call(list, el => {
      const tag = ((el.id || '') + ' ' + (el.name || '') + ' ' + (el.className || '') + ' ' + (el.getAttribute('placeholder') || '')).toLowerCase();
      if (!el.getAttribute('inputmode') && /qty|rate|amount|amt|price|disc|pct|stock|day|cost|emi|salary|hour|limit|opening|tenure|num/.test(tag)) el.setAttribute('inputmode', 'decimal');
      if (/phone|mobile|pin|gstin/.test(tag)) { el.setAttribute('autocomplete', 'off'); if (/phone|mobile/.test(tag)) el.setAttribute('inputmode', 'tel'); }
      if (/^text$/i.test(el.type || '') && /name|party|product|note|reason|address|area|label|title/i.test(tag)) el.setAttribute('autocapitalize', 'words');
    });
  } catch (e) {}
}
/* desktop par hi auto-focus — phone pe keyboard apne aap na khule */
function finePointer() {
  try { return !window.matchMedia || window.matchMedia('(hover:hover) and (pointer:fine)').matches; } catch (e) { return true; }
}

function openModal(opts) {
  /* opts: {title, sub, body, foot, width} */
  $('#modalRoot').innerHTML =
    '<div class="modal-back"><div class="modal" style="max-width:' + (opts.width || 720) + 'px">' +
      '<div class="modal-head"><div><h3>' + (opts.title || '') + '</h3>' + (opts.sub ? '<div class="sub">' + opts.sub + '</div>' : '') + '</div>' +
        '<button class="x" data-act="closeModal" type="button">✕</button></div>' +
      '<div class="modal-body">' + opts.body + '</div>' +
      (opts.foot ? '<div class="modal-foot">' + opts.foot + '</div>' : '') +
    '</div></div>';
  upgradeInputs($('#modalRoot'));
  const first = $('#modalRoot input, #modalRoot select, #modalRoot textarea');
  if (first && opts.focus !== false && finePointer()) setTimeout(() => { try { first.focus(); } catch (e) {} }, 40);
}

/* standard single-record form */
function openForm(o) {
  const vals = o.values || {};
  const body = '<form id="stdForm" autocomplete="off"><div class="fields">' +
    (o.fields || []).map(f => fieldHTML(f, vals)).join('') + '</div>' + (o.extraHTML || '') + '</form>';
  openModal({
    title: o.title, sub: o.sub, body: body,
    foot: '<button class="btn" type="button" data-act="closeModal">Cancel</button>' +
      '<button class="btn primary" type="button" id="stdSubmit">' + (o.submit || 'Save') + '</button>'
  });
  const go = () => {
    const form = $('#stdForm');
    const data = {};
    Array.from(form.elements).forEach(el => {
      if (!el.name) return;
      if (el.type === 'checkbox') data[el.name] = el.checked ? 1 : 0;
      else data[el.name] = el.value;
    });
    const keep = o.onSubmit(data);
    if (keep === false) return;
    closeModal(); render();
  };
  $('#stdSubmit').onclick = go;
  $('#stdForm').onsubmit = e => { e.preventDefault(); go(); };
  $('#stdForm').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); go(); } });
}

/* confirm helper */
function confirmBox(msg, onYes, yesLabel) {
  openModal({
    title: 'Confirm karein', width: 440,
    body: '<p style="font-size:13.2px;color:#42526b">' + msg + '</p>',
    foot: '<button class="btn" data-act="closeModal">Nahi</button>' +
      '<button class="btn primary" id="cfYes">' + (yesLabel || 'Haan, karo') + '</button>'
  });
  $('#cfYes').onclick = () => { closeModal(); onYes(); };
}

/* ---- table builder ---- */
function tableHTML(cols, rows, opts) {
  opts = opts || {};
  if (!rows || !rows.length) {
    return '<div class="empty"><b>' + (opts.emptyTitle || 'Koi record nahi') + '</b>' + (opts.empty || 'Naya entry add karein.') + '</div>';
  }
  const head = '<tr>' + cols.map(c => '<th class="' + (c.cls || '') + '">' + c.label + '</th>').join('') + '</tr>';
  const body = rows.map(r => '<tr' + (r.__cls ? ' class="' + r.__cls + '"' : '') + '>' +
    cols.map(c => '<td class="' + (c.cls || '') + '">' + (c.render ? c.render(r) : esc(r[c.key])) + '</td>').join('') + '</tr>').join('');
  const foot = opts.foot ? '<tfoot>' + opts.foot + '</tfoot>' : '';
  return '<div class="tbl-wrap"><table class="tbl ' + (opts.compact ? 'compact' : '') + '"><thead>' + head + '</thead><tbody>' + body + '</tbody>' + foot + '</table></div>';
}

/* ---- chart: bar chart ---- */
function barChart(points, o) {
  o = o || {};
  const w = o.width || 760, h = o.height || 170, pad = { t: 12, r: 8, b: 22, l: 8 };
  if (!points.length) return '<div class="empty" style="padding:20px">Data nahi</div>';
  const max = Math.max.apply(null, points.map(p => p.value).concat([1]));
  const iw = (w - pad.l - pad.r) / points.length;
  const bw = Math.max(4, Math.min(26, iw * 0.62));
  let bars = '', labels = '';
  points.forEach((p, i) => {
    const x = pad.l + i * iw + (iw - bw) / 2;
    const bh = Math.max(2, (h - pad.t - pad.b) * (p.value / max));
    const y = h - pad.b - bh;
    const fill = p.color || '#2f6ea5';
    bars += '<g><rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + bh.toFixed(1) + '" rx="3" fill="' + fill + '" opacity="' + (p.dim ? .35 : .92) + '"><title>' + esc(p.label) + ': ' + INR0(p.value) + '</title></rect></g>';
    if (points.length <= 32 || i % Math.ceil(points.length / 16) === 0) {
      labels += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (h - 6) + '" font-size="9" fill="#7b8a9e" text-anchor="middle">' + esc(p.short || p.label) + '</text>';
    }
  });
  return '<div class="chartbox"><svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" style="width:100%;height:' + h + 'px">' +
    '<line x1="0" y1="' + (h - pad.b) + '" x2="' + w + '" y2="' + (h - pad.b) + '" stroke="#e3e9f1"/>' + bars + labels + '</svg></div>';
}

/* ---- donut / stacked share bar ---- */
function shareBar(segs) {
  const total = segs.reduce((s, x) => s + Math.max(0, x.value), 0) || 1;
  return '<div class="tracker">' + segs.map(s =>
    '<i style="width:' + (Math.max(0, s.value) / total * 100).toFixed(2) + '%;background:' + s.color + '" title="' + esc(s.label) + '"></i>'
  ).join('') + '</div>';
}

/* ---- icons ---- */
const IC = {
  dash: '<rect x="3" y="3" width="7.5" height="8" rx="1.6"/><rect x="13.5" y="3" width="7.5" height="5" rx="1.6"/><rect x="3" y="14" width="7.5" height="7" rx="1.6"/><rect x="13.5" y="11" width="7.5" height="10" rx="1.6"/>',
  bread: '<path d="M4 11.5c0-3.6 3.2-6 8-6s8 2.4 8 6V18a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 18z"/><path d="M8 9.5V18M12 8.5V19M16 9.5V18"/>',
  oven: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M7 6.4h.01M10 6.4h.01"/><rect x="6.5" y="12" width="11" height="5" rx="1"/>',
  bill: '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9.5 8h5M9.5 12h5"/>',
  shop: '<path d="M4 9.5V20h16V9.5"/><path d="M3 9.5 5 4h14l2 5.5a3 3 0 0 1-5 1 3 3 0 0 1-5 0 3 3 0 0 1-5-1z"/>',
  cart: '<circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2.5 3h2.6l2.4 11h11l2-8H6"/>',
  truck: '<path d="M2.5 6.5h10v10h-10z"/><path d="M12.5 10h4l3 3v3.5h-7z"/><circle cx="6.5" cy="18.5" r="1.6"/><circle cx="16.5" cy="18.5" r="1.6"/>',
  money: '<rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 10v4M18 10v4"/>',
  expense: '<path d="M12 3v18"/><path d="M16.5 7.5c0-1.9-2-3-4.5-3s-4.5 1.1-4.5 3 2 2.6 4.5 3.2 4.5 1.2 4.5 3.3-2 3-4.5 3-4.5-1.2-4.5-3"/>',
  staff: '<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><path d="M16 5.2a3.2 3.2 0 0 1 0 6M17.5 20c0-2.4-.8-4.2-2.2-5.3"/>',
  chart: '<path d="M3.5 20V4"/><path d="M3.5 20h17"/><rect x="6.5" y="12" width="3.2" height="5"/><rect x="11.5" y="8" width="3.2" height="9"/><rect x="16.5" y="5" width="3.2" height="12"/>',
  pie: '<path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M14.5 2.6A9 9 0 0 1 21.4 9.5h-6.9z"/>',
  ledger: '<path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H19v18H5.5A1.5 1.5 0 0 1 4 19.5z"/><path d="M8 8h7M8 12h7M8 16h4"/>',

  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M4.2 7.5l2 1.2M17.8 15.3l2 1.2M4.2 16.5l2-1.2M17.8 8.7l2-1.2"/>',
  dashlet: '<circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/>'

    const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
    db.attendance = [];
    const mStart = startOfMonth(TODAY);
    for (let d = mStart; d <= TODAY; d = addDays(d, 1)) {
      if (d > TODAY) break;
      db.staff.forEach(st => {
        const r = chance(.88);
        const status = r ? 'P' : (chance(.5) ? 'H' : 'A');
        db.attendance.push({ id: uid('at'), date: d, staffId: st.id, status: status, ot: (status === 'P' && chance(.18)) ? ri(1, 3) : 0 });
      });
    }
    db.advances = db.staff.slice(0, 2).map((st, i) => ({
      id: uid('adv'), date: addDays(TODAY, -(6 + i * 4)), staffId: st.id,
      amount: i ? 1500 : 2000, mode: 'cash', note: 'ghar ke liye advance'
    }));
    db.salaryPaid = [];
    db.staff.forEach(st => {
      const recs = db.attendance.filter(a => a.staffId === st.id && monthKey(a.date) === monthKey(TODAY));
      const P = recs.filter(a => a.status === 'P').length, H = recs.filter(a => a.status === 'H').length;
      const ot = recs.reduce((a, b) => a + num(b.ot), 0);
      const perDay = st.payType === 'monthly' ? num(st.rate) / 26 : num(st.rate);
      const earned = r2(perDay * (P + H * .5) + ot * perDay / 8);
      const adv = db.advances.filter(a => a.staffId === st.id).reduce((a, b) => a + num(b.amount), 0);
      db.salaryPaid.push({ id: uid('sp'), date: startOfMonth(TODAY), month: monthKey(TODAY), staffId: st.id, amount: r2(Math.max(0, earned - adv)) });
    });
  }

  return db;
}

/* ---------- generate 60+ days of realistic transactions ---------- */
function buildSeedTransactions(db) {
  let seed = 987654321;
  const rnd = () => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; };
  const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  const chance = p => rnd() < p;
  const shuffle = arr => arr.map(v => [rnd(), v]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
  const rmoney = v => Math.round(v);

  const VOL = 2;               // business volume multiplier (demo data)
  const start = addDays(TODAY, -62);
  const byId = {};
  db.products.forEach(p => byId[p.id] = p);

  const PLAN = [
    { id: 'BREAD', min: 30, max: 42, chance: .96 },
    { id: 'PIZZABASE', min: 32, max: 52, chance: .95 },
    { id: 'SAMOSA', min: 110, max: 175, chance: .97 },
    { id: 'PATTIES', min: 85, max: 135, chance: .95 },
    { id: 'SANDWICH', min: 30, max: 55, chance: .92 },
    { id: 'BUN', min: 150, max: 220, chance: .94 },
    { id: 'CAKE500', min: 3, max: 9, chance: .62 },
    { id: 'COOKIES', min: 20, max: 40, chance: .7 }
  ];
  const outstanding = {};
  db.parties.filter(p => p.type === 'outlet').forEach(p => outstanding[p.id] = 0);

  for (let d = start; d <= TODAY; d = addDays(d, 1)) {
    const dow = new Date(d + 'T00:00:00').getDay();
    const dom = Number(d.slice(8, 10));
    const avail = {};

    /* 1) PRODUCTION */
    PLAN.forEach(pl => {
      if (!chance(pl.chance)) return;
      let q = ri(pl.min, pl.max) * VOL;
      if (dow === 0) q = Math.round(q * 0.85);
      const p = byId[pl.id];
      const yq = Math.max(0.0001, productCost(p).yieldQty);
      db.production.push({ id: uid('pr'), date: d, productId: pl.id, qty: q, batches: r3(q / yq) });
      avail[pl.id] = q;
    });

    const makeSale = (pid, qty, channel, partyId, payMode, discPct) => {
      const p = byId[pid];
      if (!p) return;
      const cap = avail[pid] || 0;
      const q = Math.min(qty, Math.floor(cap));
      if (q <= 0) return;
      avail[pid] = cap - q;
      let rate = channel === 'supply' ? supplyRateOf(p) : priceOf(p);
      if (discPct) rate = r3(rate * (1 - discPct / 100));
      rate = Math.round(rate * 2) / 2;
      db.sales.push({
        id: uid('sl'), date: d, channel, productId: pid, qty: q, rate,
        partyId: partyId || '', payMode: payMode || 'cash', discPct: discPct || 0,
        gstPct: p.gstPct, invNo: ''
      });
      if (channel === 'supply' && payMode === 'credit' && partyId) {
        outstanding[partyId] = (outstanding[partyId] || 0) + q * rate;
      }
    };

    /* 2) MARKETING SUPPLY — outlets ko supply */
    shuffle(db.parties.filter(p => p.type === 'outlet')).forEach(o => {
      const prob = o.creditDays >= 21 ? .36 : .46;
      if (!chance(prob)) return;
      const items = shuffle(['BREAD', 'PIZZABASE', 'SAMOSA', 'PATTIES', 'BUN', 'COOKIES', 'CAKE500']).slice(0, ri(1, 3));
      const payMode = chance(.15) ? 'upi' : 'credit';
      const disc = chance(.25) ? ri(2, 6) : 0;
      items.forEach(pid => {
        const ranges = { BREAD: [8, 20], PIZZABASE: [4, 12], SAMOSA: [18, 45], PATTIES: [14, 34], BUN: [25, 50], COOKIES: [4, 10], CAKE500: [1, 2] };
        const rr = ranges[pid] || [2, 8];
        makeSale(pid, ri(rr[0], rr[1]) * VOL, 'supply', o.id, payMode, disc);
      });
    });

    /* 3) BAKERY COUNTER */
    const bakeryPlan = { BREAD: [10, 20], PIZZABASE: [8, 18], SAMOSA: [25, 45], PATTIES: [14, 30], SANDWICH: [12, 25], BUN: [20, 40], CAKE500: [1, 4], COOKIES: [5, 12] };
    Object.keys(bakeryPlan).forEach(pid => {
      if (!chance(.93)) return;
      const rr = bakeryPlan[pid];
      makeSale(pid, ri(rr[0], rr[1]) * VOL, 'bakery', '', chance(.55) ? 'cash' : 'upi', 0);
    });

    /* 4) STORE / STALL COUNTER */
    const storePlan = { CHAI: [22, 48], COLDDRINK: [12, 30], CHIPS: [8, 20], WATER: [5, 15], SAMOSA: [10, 25], PATTIES: [8, 18], BUN: [10, 25], SANDWICH: [5, 15], CAKE500: [0, 2] };
    Object.keys(storePlan).forEach(pid => {
      if (!chance(.9)) return;
      const rr = storePlan[pid];
      if (pid === 'CHAI' || pid === 'COLDDRINK' || pid === 'CHIPS' || pid === 'WATER') {
        const p = byId[pid];
        const q = ri(rr[0], rr[1]) * VOL;
        const rate = Math.round(priceOf(p));
        db.sales.push({ id: uid('sl'), date: d, channel: 'store', productId: pid, qty: q, rate, partyId: '', payMode: chance(.6) ? 'cash' : 'upi', discPct: 0, gstPct: p.gstPct, invNo: '' });
      } else {
        makeSale(pid, ri(rr[0], rr[1]) * VOL, 'store', '', chance(.6) ? 'cash' : 'upi', 0);
      }
    });

    /* 5) PAYMENTS IN from outlets */
    Object.keys(outstanding).forEach(pid => {
      if (!outstanding[pid]) return;
      if (chance(.22)) {
        const amt = Math.round(outstanding[pid] * (ri(55, 100) / 100));
        if (amt > 0) {
          db.payments.push({ id: uid('pay'), date: d, partyId: pid, amount: amt, mode: chance(.5) ? 'cash' : 'upi', note: 'Outlet payment' });
          outstanding[pid] -= amt;
        }
      }
    });

    /* 6) EXPENSES */
    const exp = (vertical, category, amount, note) => db.expenses.push({ id: uid('ex'), date: d, vertical, category, amount, note: note || '' });
    if (dom === 1) {
      exp('store', 'Shop Rent', 12000, 'MP Nagar shop ka kiraya');
      exp('bakery', 'Rent / Godown', 6000, 'Bakery godown');
      exp('common', 'Mobile / Internet', 699, 'Broadband + phone');
      /* staff salary */
      const byV = {};
      db.staff.forEach(s => {
        const m = s.payType === 'monthly' ? s.rate : s.rate * s.daysPresent;
        byV[s.vertical] = (byV[s.vertical] || 0) + m;
      });
      Object.keys(byV).forEach(v => exp(v, 'Staff Salary', byV[v], 'Monthly salary'));
    }
    if (dom === 5) exp('common', 'Electricity', ri(6200, 7800), 'MPEB bill');
    if (dom % 5 === 2) exp('bakery', 'Gas Cylinder', 1450, 'LPG commercial');
    if (dow === 1) exp('supply', 'Transport / Fuel', ri(700, 1100), 'Delivery van');
    if (dom === 12) exp('bakery', 'Machine Maintenance', ri(600, 1200), 'Oven / mixer servicing');
    if (dom === 20) exp('store', 'Packaging Material', ri(2500, 4000), 'Pouches / boxes');
    if (chance(.12)) exp('common', 'Misc / Repairs', ri(180, 850), 'Daily misc');
    if (dom === 8) exp('store', 'Cleaning / Consumables', ri(400, 900), '');
  }

  /* 6.5) PRODUCTION ko sales ke hisaab se trim karein (fresh bakery me FG stock ~0 hota hai) */
  const soldBy = {}, soldOn = {};
  db.sales.forEach(s => {
    soldBy[s.productId] = (soldBy[s.productId] || 0) + num(s.qty);
    const k = s.productId + '|' + s.date;
    soldOn[k] = (soldOn[k] || 0) + num(s.qty);
  });
  db.products.forEach(p => {
    const sold = soldBy[p.id] || 0;
    let produced = db.production.filter(x => x.productId === p.id).reduce((a, x) => a + num(x.qty), 0);
    const target = Math.round(sold * 1.06);
    if (!produced || produced <= target) return;
    let excess = produced - target;
    const list = db.production.filter(x => x.productId === p.id).sort((a, b) => a.date < b.date ? 1 : -1);
    for (const pr of list) {
      if (excess <= 0.001) break;
      const q = num(pr.qty);
      const minKeep = num(soldOn[p.id + '|' + pr.date]) || 0;
      const cut = Math.min(q - minKeep, excess);
      if (cut > 0) { pr.qty = r3(q - cut); excess -= cut; }
    }
    db.production.forEach(x => {
      const pp = byId[x.productId];
      x.batches = r3(num(x.qty) / Math.max(0.0001, productCost(pp).yieldQty));
    });
  });
  db.production = db.production.filter(x => num(x.qty) > 0.0001);

  /* 7) PURCHASES — consumption ke hisaab se weekly */
  const cons = {};
  db.production.forEach(pr => {
    const p = byId[pr.productId];
    if (!p) return;
    (p.recipe.lines || []).forEach(l => {
      const q = lineQty(l, p.recipe) * (pr.batches || 0);
      cons[l.ingId] = (cons[l.ingId] || 0) + q;
    });
  });
  db.ingredients.forEach(ing => {
    const used = cons[ing.id] || 0;
    ing.opening = used > 0 ? r3(used * 0.12 + Number(ing.minStock) * 0.5) : r3(Number(ing.minStock) * 2);
    if (used <= 0) return;
    const total = used * 0.98 + Number(ing.minStock) * 0.5;
    const weeks = 9;
    const vendor = db.parties.find(p => p.type === 'vendor' && p.name === ing.vendor);
    for (let w = 0; w < weeks; w++) {
      const share = (w === weeks - 1) ? null : total / weeks * (0.85 + rnd() * 0.3);
      const q = r3(share || Math.max(0, total - (total / weeks * (weeks - 1) * 1.0)));
      if (q <= 0) continue;
      const rate = r3(Number(ing.rate) * (0.94 + rnd() * 0.12));
      const totalAmt = r3(q * rate);
      db.purchases.push({
        id: uid('pu'), date: addDays(start, w * 7 + 1),
        partyId: vendor ? vendor.id : '', lines: [{ ingId: ing.id, qty: q, rate }],
        amount: totalAmt, paidAmount: chance(.3) ? 0 : totalAmt,
        payMode: chance(.3) ? 'credit' : 'cash', note: 'Weekly stock'
      });
    }
  });

  /* 7.5) DEMO — wastage entries (fresh maal kharab hona) */
  db.products.forEach(p => {
    const prod = db.production.filter(x => x.productId === p.id).reduce((a, x) => a + num(x.qty), 0);
    if (!prod) return;
    let waste = Math.round(prod * 0.028);
    const reasons = ['Expiry', 'Damage', 'Over-production'];
    while (waste > 0) {
      const q = Math.min(waste, ri(2, Math.max(3, Math.round(waste / 6))));
      db.wastage.push({
        id: uid('w'), date: addDays(start, ri(0, daysBetween(start, TODAY))), vertical: (p.category === 'Store' || p.category === 'Resale') ? 'store' : 'bakery',
        itemType: 'product', itemId: p.id, qty: q, reason: reasons[ri(0, 2)],
        note: '', rate: r2(productCost(p).perPc)
      });
      waste -= q;
    }
  });
  /* demo stock adjust (physical count) */
  db.stockAdj.push({ id: uid('sa'), date: addDays(TODAY, -6), ingId: 'POTATO', type: 'less', qty: 2, reason: 'Physical count', note: 'gaalne se nuksan' });

  /* 7.6) DEMO — orders (kuch pending, kuch partial) */
  const orderDates = [0, 1, 1, 2, 3, 4, 5, 7, 8, 10, 12];
  orderDates.forEach((back, i) => {
    const o = db.parties.filter(p => p.type === 'outlet')[i % 8];
    const items = shuffle(['BREAD', 'PIZZABASE', 'SAMOSA', 'PATTIES', 'BUN', 'COOKIES']).slice(0, ri(1, 3));
    db.orders.push({
      id: uid('ord'), date: addDays(TODAY, -back), partyId: o.id, status: 'open', note: '',
      lines: items.map(pid => {
        const p = byId[pid];
        return { productId: pid, qty: ri(10, 40), rate: supplyRateOf(p) };
      })
    });
  });

  /* 8) demo ke liye 3 items ka stock minimum se niche (reorder alert dikhane ke liye) */
  const demoLow = { POTATO: 0.42, CAKEBOX: 0.55, RES_DRINK: 0.35 };
  Object.keys(demoLow).forEach(k => {
    const ing = db.ingredients.find(i => i.id === k);
    if (ing) ing.opening = r3(num(ing.opening) * demoLow[k]);
  });

  /* 9) invoice numbers for supply sales */
  let inv = 1;
  db.sales.filter(s => s.channel === 'supply').sort((a, b) => a.date < b.date ? -1 : 1)
    .forEach(s => { s.invNo = db.meta.invoicePrefix + String(inv++).padStart(4, '0'); });

  db.sales.sort((a, b) => a.date < b.date ? 1 : -1);
  db.production.sort((a, b) => a.date < b.date ? 1 : -1);
  db.purchases.sort((a, b) => a.date < b.date ? 1 : -1);
  db.expenses.sort((a, b) => a.date < b.date ? 1 : -1);
  db.payments.sort((a, b) => a.date < b.date ? 1 : -1);
}
/* ================= DREAM SANDWICH — COSTING & P&L ENGINE ================= */
const CHANNELS = [
  { id: 'bakery', label: 'Bakery', sub: 'Production + counter', color: '#d97706', cls: 'bakery' },
  { id: 'store', label: 'Store / Stall', sub: 'Counter sales', color: '#0d9488', cls: 'store' },
  { id: 'supply', label: 'Marketing Supply', sub: 'Outlets & distributors', color: '#4f46e5', cls: 'supply' }
];
const VLABEL = { bakery: 'Bakery', store: 'Store / Stall', supply: 'Marketing Supply', common: 'Common' };

const ingById = id => DB.ingredients.find(i => i.id === id);
const productById = id => DB.products.find(p => p.id === id);
const partyById = id => DB.parties.find(p => p.id === id);
const outlets = () => DB.parties.filter(p => p.type === 'outlet');
const vendors = () => DB.parties.filter(p => p.type === 'vendor');
const customers = () => DB.parties.filter(p => p.type === 'customer');
const buyers = () => DB.parties.filter(p => p.type !== 'vendor');
const agents = () => (DB.agents || []);

/* ---- wastage / stock adjust cost ---- */
function wastageCost(w) {
  if (w.itemType === 'ingredient') { const ing = ingById(w.itemId); return r2(num(w.qty) * num(ing && ing.rate)); }
  const p = productById(w.itemId);
  return r2(num(w.qty) * productCost(p).perPc);
}
function agentBalance(agentId) {
  const collected = DB.sales.filter(s => s.agentId === agentId && s.payMode === 'cash').reduce((a, s) => a + num(s.qty) * num(s.rate), 0);
  const deposited = (DB.agentDeposits || []).filter(d => d.agentId === agentId).reduce((a, d) => a + num(d.amount), 0);
  return r2(collected - deposited);
}

/* ---- ek recipe line ki quantity (formula support: "0.25", "12%", "base*0.02") ---- */
function lineQty(line, r) {
  const base = num(r && r.batchBase);
  const yq = num(r && r.yieldQty);
  const raw = line && line.qty !== undefined ? line.qty : 0;
  const v = num(raw, { base: base, yq: yq });
  return isFinite(v) ? v : 0;
}

/* ---- PRODUCT COST (master formula) ----
   Cost/pc = (Σ ingredient cost ÷ yield ÷ (1 - wastage%)) + (labour + overhead) ÷ yield + packaging/pc  */
function productCost(p) {
  const empty = { perPc: 0, perBatch: 0, lines: [], ingr: 0, labour: 0, overhead: 0, packaging: 0, yieldQty: 1, wastage: 0, packPerPc: 0 };
  if (!p) return empty;
  if (p.combo && p.combo.length) {
    const perPc = p.combo.reduce((a, c) => a + productCost(productById(c.productId)).perPc * num(c.qty), 0);
    return { perPc: perPc, perBatch: perPc, lines: [], ingr: perPc, labour: 0, overhead: 0, packaging: 0, yieldQty: 1, wastage: 0, packPerPc: 0, comboMode: true };
  }
  if (p.costMode === 'purchase') {
    const c = num(p.purchaseCost);
    return { perPc: c, perBatch: c, lines: [], ingr: c, labour: 0, overhead: 0, packaging: 0, yieldQty: 1, wastage: 0, packPerPc: 0, directMode: true };
  }
  const r = p.recipe || { lines: [] };
  const yq = Math.max(0.0001, num(r.yieldQty) || 1);
  const lines = (r.lines || []).map(l => {
    const ing = ingById(l.ingId) || { name: '(hataya gaya item)', unit: '', rate: 0 };
    const q = lineQty(l, r);
    const rate = num(ing.rate);
    return { ingId: l.ingId, name: ing.name, unit: ing.unit, qty: q, rate: rate, amt: q * rate };
  });
  const ingr = lines.reduce((s, l) => s + l.amt, 0);
  const labour = num(r.labourPerBatch);
  const overhead = num(r.overheadPerBatch);
  const packPerPc = num(r.packagingPerPc);
  const w = clamp(num(r.wastagePct), 0, 90);
  const perPc = ingr / (yq * (1 - w / 100)) + (labour + overhead) / yq + packPerPc;
  return {
    perPc: perPc, perBatch: ingr + labour + overhead + packPerPc * yq, lines: lines,
    ingr: ingr, labour: labour, overhead: overhead, packaging: packPerPc * yq,
    yieldQty: yq, wastage: w, packPerPc: packPerPc
  };
}

/* ---- selling price (auto = cost + markup, formula driven) ---- */
function priceOf(p) {
  if (!p) return 0;
  if (!Number(p.autoPrice)) return r2(num(p.price));
  const step = num(p.priceRound) || 1;
  const raw = productCost(p).perPc * (1 + num(p.markupPct) / 100);
  return Math.max(step, Math.ceil(raw / step) * step);
}
function suggestedPrice(p) {
  const step = num(p.priceRound) || 1;
  return Math.max(step, Math.ceil(productCost(p).perPc * (1 + num(p.markupPct) / 100) / step) * step);
}
const supplyRateOf = p => (num(p.bulkPrice) || Math.round(priceOf(p) * 0.92));
const rateFor = (p, channel) => channel === 'supply' ? supplyRateOf(p) : priceOf(p);

/* ---- STOCK (ledger based: opening + purchase − production use) ---- */
function ingredientStock() {
  const m = {};
  DB.ingredients.forEach(i => m[i.id] = num(i.opening));
  DB.purchases.forEach(pu => (pu.lines || []).forEach(l => {
    if (m[l.ingId] !== undefined) m[l.ingId] += num(l.qty);
  }));
  DB.production.forEach(pr => {
    const p = productById(pr.productId);
    if (!p || p.costMode === 'purchase') return;
    const b = num(pr.batches) || (num(pr.qty) / Math.max(0.0001, num(p.recipe && p.recipe.yieldQty) || 1));
    (p.recipe && p.recipe.lines || []).forEach(l => {
      if (m[l.ingId] !== undefined) m[l.ingId] -= lineQty(l, p.recipe) * b;
    });
  });
  (DB.stockAdj || []).forEach(a => {
    if (m[a.ingId] === undefined) return;
    m[a.ingId] += (a.type === 'less' ? -1 : 1) * num(a.qty);
  });
  (DB.wastage || []).forEach(w => {
    if (w.itemType === 'ingredient' && m[w.itemId] !== undefined) m[w.itemId] -= num(w.qty);
  });
  Object.keys(m).forEach(k => m[k] = r3(m[k]));
  return m;
}
function stockRows() {
  const st = ingredientStock();
  return DB.ingredients.map(i => {
    const q = st[i.id] || 0;
    const min = num(i.minStock);
    return {
      ing: i, stock: q, value: r2(q * num(i.rate)), min: min,
      status: q <= 0 ? 'out' : (q < min ? 'low' : 'ok')
    };
  });
}
function lowStockRows() { return stockRows().filter(r => r.status !== 'ok'); }

function finishedStock() {
  const m = {};
  DB.products.forEach(p => m[p.id] = 0);
  DB.production.forEach(pr => { if (m[pr.productId] !== undefined) m[pr.productId] += num(pr.qty); });
  DB.sales.forEach(s => {
    const pp = productById(s.productId);
    if (pp && pp.combo && pp.combo.length) {
      pp.combo.forEach(c => { if (m[c.productId] !== undefined) m[c.productId] -= num(c.qty) * num(s.qty); });
    } else if (m[s.productId] !== undefined) m[s.productId] -= num(s.qty);
  });
  (DB.wastage || []).forEach(w => { if (w.itemType === 'product' && m[w.itemId] !== undefined) m[w.itemId] -= num(w.qty); });
  return m;
}

/* ---- period state ---- */
const P = { mode: 'month', from: startOfMonth(TODAY), to: TODAY };
function applyPeriod(mode) {
  P.mode = mode;
  const t = TODAY;
  if (mode === 'today') { P.from = t; P.to = t; }
  else if (mode === 'week') { P.from = addDays(t, -6); P.to = t; }
  else if (mode === 'month') { P.from = startOfMonth(t); P.to = t; }
  else if (mode === 'lastmonth') { const s = addDays(startOfMonth(t), -1); P.from = startOfMonth(s); P.to = s; }
  else if (mode === 'quarter') { P.from = addDays(t, -89); P.to = t; }
  else if (mode === 'fy') { P.from = fyStart(t); P.to = t; }
  else if (mode === 'all') {
    const all = DB.sales.concat(DB.purchases, DB.expenses, DB.production, DB.payments).map(x => x.date).filter(Boolean).sort();
    P.from = all[0] || startOfMonth(t); P.to = all[all.length - 1] || t;
  }
  syncPeriodInputs();
}
function syncPeriodInputs() {
  const s = $('#periodSel'), f = $('#fromDate'), t = $('#toDate');
  if (s) s.value = P.mode;
  if (f) f.value = P.from;
  if (t) t.value = P.to;
}
const inP = d => d >= P.from && d <= P.to;
const periodLabel = () => dmy(P.from) + '  –  ' + dmy(P.to);
const salesIn = (from, to, ch) => DB.sales.filter(s => s.date >= from && s.date <= to && (!ch || s.channel === ch));

/* ---- VERTICAL WISE P&L ---- */
function plFor(from, to) {
  const res = {};
  CHANNELS.forEach(c => res[c.id] = {
    id: c.id, label: c.label, sales: 0, taxable: 0, gst: 0, cogs: 0, gross: 0,
    expenses: 0, expCats: {}, profit: 0, qty: 0, bills: 0, discountGiven: 0, wastage: 0
  });
  const common = { label: 'Common', expenses: 0, expCats: {} };

  DB.sales.forEach(s => {
    if (s.date < from || s.date > to) return;
    const c = res[s.channel]; if (!c) return;
    const amt = num(s.qty) * num(s.rate);
    const g = num(s.gstPct);
    const taxable = amt / (1 + g / 100);
    c.sales += amt;
    c.taxable += taxable;
    c.gst += amt - taxable;
    c.qty += num(s.qty);
    c.bills += 1;
    c.discountGiven += (num(s.discPct) / 100) * amt / (1 - num(s.discPct) / 100 || 1);
    const p = productById(s.productId);
    c.cogs += productCost(p).perPc * num(s.qty);
  });
  CHANNELS.forEach(c => {
    const r = res[c.id];
    r.gross = r.taxable - r.cogs;
    r.grossMarginPct = r.taxable ? r.gross / r.taxable * 100 : 0;
  });
  DB.wastage.forEach(w => {
    if (w.date < from || w.date > to) return;
    const tgt = res[w.vertical] || res.bakery;
    tgt.wastage += wastageCost(w);
  });
  (DB.writeOffs || []).forEach(w => {
    if (w.date < from || w.date > to) return;
    common.expenses += num(w.amount);
    common.expCats['Bad Debt'] = (common.expCats['Bad Debt'] || 0) + num(w.amount);
  });
  DB.expenses.forEach(e => {
    if (e.date < from || e.date > to) return;
    const tgt = (e.vertical === 'common') ? common : res[e.vertical];
    if (!tgt) return;
    tgt.expenses += num(e.amount);
    tgt.expCats[e.category] = (tgt.expCats[e.category] || 0) + num(e.amount);
  });
  CHANNELS.forEach(c => {
    const r = res[c.id];
    r.profit = r.gross - r.wastage - r.expenses;
    r.netMarginPct = r.taxable ? r.profit / r.taxable * 100 : 0;
  });
  const revenue = CHANNELS.reduce((s, c) => s + res[c.id].taxable, 0);
  const cogs = CHANNELS.reduce((s, c) => s + res[c.id].cogs, 0);
  const gross = revenue - cogs;
  const totalExp = CHANNELS.reduce((s, c) => s + res[c.id].expenses + res[c.id].wastage, 0) + common.expenses;
  const totalWastage = CHANNELS.reduce((s, c) => s + res[c.id].wastage, 0);
  const net = gross - totalExp;
  /* common expenses revenue share me allocate (sirf display ke liye) */
  CHANNELS.forEach(c => {
    const r = res[c.id];
    r.commonShare = revenue ? common.expenses * (r.taxable / revenue) : 0;
    r.profitAfterCommon = r.profit - r.commonShare;
  });
  return {
    channels: res, common: common,
    total: {
      sales: CHANNELS.reduce((s, c) => s + res[c.id].sales, 0),
      taxable: revenue, gst: CHANNELS.reduce((s, c) => s + res[c.id].gst, 0),
      cogs: cogs, gross: gross, expenses: totalExp, wastage: totalWastage, net: net,
      netMarginPct: revenue ? net / revenue * 100 : 0,
      qty: CHANNELS.reduce((s, c) => s + res[c.id].qty, 0),
      bills: CHANNELS.reduce((s, c) => s + res[c.id].bills, 0)
    }
  };
}

/* ---- PRODUCT WISE P&L ---- */
function productPL(from, to) {
  const map = {};
  DB.sales.forEach(s => {
    if (s.date < from || s.date > to) return;
    const p = productById(s.productId);
    const m = map[s.productId] || (map[s.productId] = {
      productId: s.productId, name: p ? p.name : '(deleted)', category: p ? (p.category || '-') : '-',
      qty: 0, sales: 0, taxable: 0, cogs: 0, profit: 0, bakery: 0, store: 0, supply: 0
    });
    const amt = num(s.qty) * num(s.rate);
    const g = num(s.gstPct);
    m.qty += num(s.qty);
    m.sales += amt;
    m.taxable += amt / (1 + g / 100);
    m.cogs += productCost(p).perPc * num(s.qty);
    if (m[s.channel] !== undefined) m[s.channel] += num(s.qty) * num(s.rate);
  });
  const rows = Object.values(map);
  rows.forEach(r => {
    r.profit = r.taxable - r.cogs;
    r.marginPct = r.taxable ? r.profit / r.taxable * 100 : 0;
    r.unitCost = r.qty ? r.cogs / r.qty : 0;
    r.unitPrice = r.qty ? r.taxable / r.qty : 0;
  });
  rows.sort((a, b) => b.profit - a.profit);
  return rows;
}

/* ---- PARTY / UDHAAR LEDGER ---- */
function partyBalance(partyId) {
  const p = partyById(partyId);
  if (!p) return { receivable: 0, payable: 0 };
  if (p.type === 'outlet' || p.type === 'customer') {
    const credit = DB.sales.filter(s => s.partyId === partyId && s.payMode === 'credit')
      .reduce((a, s) => a + num(s.qty) * num(s.rate), 0);
    const paid = DB.payments.filter(x => x.partyId === partyId).reduce((a, x) => a + num(x.amount), 0);
    const wo = (DB.writeOffs || []).filter(x => x.partyId === partyId).reduce((a, x) => a + num(x.amount), 0);
    return { receivable: r2(num(p.opening) + credit - paid - wo), payable: 0 };
  }
  const pur = DB.purchases.filter(x => x.partyId === partyId).reduce((a, x) => a + num(x.amount), 0);
  const paid = DB.purchases.filter(x => x.partyId === partyId).reduce((a, x) => a + num(x.paidAmount), 0);
  const vpay = (DB.vendorPayments || []).filter(x => x.partyId === partyId).reduce((a, x) => a + num(x.amount), 0);
  return { receivable: 0, payable: r2(num(p.opening) + pur - paid - vpay) };
}
function partyLedgerRows(partyId) {
  const p = partyById(partyId);
  const rows = [];
  if (!p) return rows;
  if (p.type === 'outlet' || p.type === 'customer') {
    DB.sales.forEach(s => {
      if (s.partyId !== partyId || s.payMode !== 'credit') return;
      rows.push({ date: s.date, type: 'Bill', ref: s.invNo || '-', narration: (productById(s.productId) || {}).name + ' × ' + QTY(s.qty), debit: r2(num(s.qty) * num(s.rate)), credit: 0 });
    });
    DB.payments.forEach(x => {
      if (x.partyId !== partyId) return;
      rows.push({ date: x.date, type: 'Receipt', ref: x.mode.toUpperCase(), narration: x.note || 'Payment received', debit: 0, credit: num(x.amount) });
    });
  } else {
    DB.purchases.forEach(x => {
      if (x.partyId !== partyId) return;
      rows.push({ date: x.date, type: 'Purchase', ref: (x.lines || []).length + ' item', narration: (x.lines || []).map(l => (ingById(l.ingId) || {}).name).join(', '), debit: 0, credit: num(x.amount) });
      if (num(x.paidAmount) > 0) rows.push({ date: x.date, type: 'Payment', ref: x.payMode.toUpperCase(), narration: 'Vendor ko payment', debit: num(x.paidAmount), credit: 0 });
    });
  }
  rows.sort((a, b) => a.date < b.date ? -1 : 1);
  let bal = num(p.opening);
  rows.forEach(r => { bal += r.debit - r.credit; r.balance = r2(bal); });
  return rows;
}
function outstandingList() {
  return buyers().map(p => {
    const b = partyBalance(p.id).receivable;
    const lastPay = DB.payments.filter(x => x.partyId === p.id).map(x => x.date).sort().pop();
    const lastSale = DB.sales.filter(s => s.partyId === p.id).map(s => s.date).sort().pop();
    return { party: p, balance: b, lastPay: lastPay || '', lastSale: lastSale || '', overLimit: num(p.creditLimit) > 0 && b > num(p.creditLimit) };
  }).filter(r => r.balance > 0.5).sort((a, b) => b.balance - a.balance);
}

/* ---- GST SUMMARY ---- */
function gstSummary(from, to) {
  const buckets = {};
  DB.sales.forEach(s => {
    if (s.date < from || s.date > to) return;
    const g = num(s.gstPct);
    const amt = num(s.qty) * num(s.rate);
    const taxable = amt / (1 + g / 100);
    const b = buckets[g] || (buckets[g] = { rate: g, taxable: 0, tax: 0, gross: 0 });
    b.taxable += taxable; b.tax += amt - taxable; b.gross += amt;
  });
  const input = DB.purchases.filter(x => x.date >= from && x.date <= to).reduce((a, x) => a + num(x.gstAmount), 0);
  const rows = Object.values(buckets).sort((a, b) => a.rate - b.rate);
  const output = rows.reduce((a, r) => a + r.tax, 0);
  return { rows, output, input, net: output - input };
}

/* ---- CASH POSITION ---- */
function cashPosition(from, to) {
  let cashIn = 0, upiIn = 0, cashOut = 0;
  DB.sales.forEach(s => {
    if (s.date < from || s.date > to) return;
    const amt = num(s.qty) * num(s.rate);
    if (s.payMode === 'cash') cashIn += amt;
    else if (s.payMode === 'upi') upiIn += amt;
  });
  DB.payments.forEach(x => { if (x.date >= from && x.date <= to) { if (x.mode === 'cash') cashIn += num(x.amount); else upiIn += num(x.amount); } });
  DB.expenses.forEach(e => { if (e.date >= from && e.date <= to) cashOut += num(e.amount); });
  (DB.vendorPayments || []).forEach(x => { if (x.date >= from && x.date <= to) cashOut += num(x.amount); });
  DB.purchases.forEach(pu => { if (pu.date >= from && pu.date <= to) { cashOut += num(pu.paidAmount); if (pu.paidAmount) upiIn += 0; } });
  return { cashIn, upiIn, cashOut, net: cashIn + upiIn - cashOut };
}

/* ---- DAY BOOK ---- */
function dayBook(from, to) {
  const rows = [];
  DB.sales.forEach(s => {
    if (s.date < from || s.date > to) return;
    const p = productById(s.productId);
    const party = s.partyId ? partyById(s.partyId) : null;
    rows.push({
      date: s.date, voucher: 'Sale', vcls: 'b-' + (s.channel === 'bakery' ? 'amber' : s.channel === 'store' ? 'teal' : 'indigo'),
      channel: s.channel,
      particulars: (p ? p.name : '-') + ' × ' + QTY(s.qty),
      account: s.payMode === 'credit' ? (party ? party.name : 'Udhaar') : (s.payMode === 'upi' ? 'UPI / Bank' : 'Cash'),
      amount: r2(num(s.qty) * num(s.rate)), dir: 'Cr', ref: s.invNo || ''
    });
  });
  DB.purchases.forEach(x => {
    if (x.date < from || x.date > to) return;
    const party = partyById(x.partyId);
    rows.push({
      date: x.date, voucher: 'Purchase', vcls: 'b-grey', channel: 'store',
      particulars: (x.lines || []).map(l => (ingById(l.ingId) || {}).name + ' ' + QTY(l.qty)).join(', ').slice(0, 70),
      account: party ? party.name : 'Vendor', amount: num(x.amount), dir: 'Dr', ref: 'PB'
    });
  });
  DB.expenses.forEach(e => {
    if (e.date < from || e.date > to) return;
    rows.push({
      date: e.date, voucher: 'Expense', vcls: 'b-red', channel: e.vertical,
      particulars: e.category + (e.note ? ' — ' + e.note : ''), account: 'Cash / Bank',
      amount: num(e.amount), dir: 'Dr', ref: ''
    });
  });
  DB.payments.forEach(x => {
    if (x.date < from || x.date > to) return;
    const party = partyById(x.partyId);
    rows.push({
      date: x.date, voucher: 'Receipt', vcls: 'b-green', channel: 'supply',
      particulars: (party ? party.name : '-') + ' se payment', account: x.mode === 'upi' ? 'UPI / Bank' : 'Cash',
      amount: num(x.amount), dir: 'Cr', ref: ''
    });
  });
  DB.production.forEach(pr => {
    if (pr.date < from || pr.date > to) return;
    const p = productById(pr.productId);
    rows.push({
      date: pr.date, voucher: 'Production', vcls: 'b-navy', channel: 'bakery',
      particulars: (p ? p.name : '-') + ' — ' + QTY(pr.qty) + ' pcs (' + QTY(pr.batches) + ' batch)',
      account: 'Finished Goods', amount: r2(productCost(p).perPc * num(pr.qty)), dir: 'Dr', ref: 'MFG'
    });
  });
  return rows.sort((a, b) => a.date < b.date ? 1 : (a.date > b.date ? -1 : 0));
}

/* ---- daily sales series ---- */
function dailySeries(from, to, ch) {
  const out = [];
  const byDate = {};
  DB.sales.forEach(s => {
    if (s.date < from || s.date > to) return;
    if (ch && s.channel !== ch) return;
    byDate[s.date] = (byDate[s.date] || 0) + num(s.qty) * num(s.rate);
  });
  for (let d = from; d <= to; d = addDays(d, 1)) {
    out.push({ date: d, label: dmyShort(d), short: dmyShort(d), value: byDate[d] || 0, day: weekday(d) });
  }
  return out;
}

const ACT = {
  nav: d => { current = d.view; closeSidebar(); render(); scrollTop(); },
  tab: d => { current = d.view; render(); scrollTop(); },
  closeModal: () => closeModal(),
  closeSidebar: () => closeSidebar(),
  openSidebar: () => openSidebar(),
  toggleSidebar: () => { const sb = $('#sidebar'); if (!sb) return; sb.classList.contains('open') ? closeSidebar() : openSidebar(); },
  periodChange: el => { const m = el.value; if (m === 'custom') return; applyPeriod(m); render(); },
  periodDate: () => {
    const f = $('#fromDate').value, t = $('#toDate').value;
    if (!f || !t) return;
    P.from = f; P.to = t; P.mode = 'custom';
    $('#periodSel').value = 'custom';

  quickExpense: () => expenseModal(),

document.addEventListener('click', e => {
  /* modal ke bahar tap/click -> band */
  if (e.target && e.target.classList && e.target.classList.contains('modal-back')) { closeModal(); return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.tagName === 'SELECT' || el.type === 'date') return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el.dataset, el); }
  /* mobile drawer: koi bhi nav item chunein -> drawer band */
  if (MOBILE_NAV() && (el.dataset.act === 'nav' || el.dataset.act === 'tab' || el.closest('#nav'))) closeSidebar();
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = ACT[el.dataset.act];
  if (fn && (el.tagName === 'SELECT' || (el.tagName === 'INPUT' && el.type === 'date'))) { fn(el.dataset, el); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  const modal = $('#modalRoot');
  if (modal && modal.innerHTML.trim()) { closeModal(); return; }
  closeSidebar();
});

function deltaChip(cur, old) {
  if (!old) return '<span class="badge b-grey">naya</span>';
  const d = (cur - old) / Math.abs(old) * 100;
  const cls = d >= 0 ? 'b-green' : 'b-red';
  return '<span class="badge ' + cls + '">' + (d >= 0 ? '▲' : '▼') + ' ' + Math.abs(d).toFixed(1) + '%</span>';
}

      '<div class="field"><label>GST %</label><select class="rpF" data-k="gstPct">' + GST_OPTS.map(g => '<option value="' + g.value + '"' + (Number(RP.gstPct) === g.value ? ' selected' : '') + '>' + g.label + '</option>').join('') + '</select></div>' +

  openModal({

    foot: '<button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" id="rpSave">Product save karein</button>'
  });

function readRecipeForm() {
  $$('#modalRoot .rpF').forEach(el => {
    const k = el.dataset.k;
    const v = el.type === 'checkbox' ? (el.checked ? 1 : 0) : el.value;
    if (k.indexOf('.') > -1) { const [, sub] = k.split('.'); RP.recipe[sub] = v; }
    else RP[k] = v;
  });
  $$('#modalRoot .rpIng').forEach(el => {
    const i = +el.dataset.i;
    if (RP.recipe.lines[i]) RP.recipe.lines[i].ingId = el.value;
  });
  $$('#modalRoot .rpQty').forEach(el => {
    const i = +el.dataset.i;
    if (RP.recipe.lines[i]) RP.recipe.lines[i].qty = el.value;
  });
}
function bindRecipe() {
  $$('#modalRoot .rpF').forEach(el => {
    const ev = (el.tagName === 'SELECT' || el.type === 'checkbox') ? 'change' : 'input';
    el.addEventListener(ev, () => {
      readRecipeForm();
      if (el.dataset.k === 'costMode' || el.dataset.k === 'autoPrice') { drawRecipe(); return; }
      updateRecipeCalc();
    });
  });
  $$('#modalRoot .rpIng').forEach(el => {
    el.addEventListener('change', () => { readRecipeForm(); updateRecipeCalc(); });
  });
  $$('#modalRoot .rpQty').forEach(el => {
    el.addEventListener('input', () => {
      readRecipeForm();
      const c = productCost(RP);
      $$('#modalRoot .rpAmt').forEach(a => {
        const i = +a.dataset.i;
        const l = c.lines[i];
        if (l) a.value = r2(l.amt);
      });
      updateRecipeCalc();
    });
  });
  $('#rpSave').onclick = () => {
    readRecipeForm();
    if (!RP.name.trim()) { toast('Product ka naam daalein', 'err'); return; }
    const copy = JSON.parse(JSON.stringify(RP));
    ['price', 'bulkPrice', 'markupPct', 'gstPct', 'priceRound', 'autoPrice', 'purchaseCost', 'shelfLife'].forEach(k => { if (copy[k] !== undefined) copy[k] = num(copy[k]); });
    ['batchBase', 'yieldQty', 'labourPerBatch', 'overheadPerBatch', 'packagingPerPc', 'wastagePct'].forEach(k => { copy.recipe[k] = num(copy.recipe[k]); });
    copy.recipe.lines = (copy.recipe.lines || []).map(l => ({ ingId: l.ingId, qty: l.qty }));
    const idx = DB.products.findIndex(p => p.id === copy.id);
    if (idx > -1) DB.products[idx] = copy; else DB.products.push(copy);
    saveDB(); closeModal(); render();
    toast('Product save ho gaya — cost ' + INR(productCost(copy).perPc) + '/pc', 'ok');
  };
}

function updateRecipeCalc() {
  const box = $('#rpCalc');
  if (!box) return;
  const c = productCost(RP);
  const sp = Number(RP.autoPrice) ? suggestedPrice(RP) : num(RP.price);
  const margin = sp ? (sp - c.perPc) / sp * 100 : 0;
  const pf = sp - c.perPc;
  box.innerHTML =
    '<div class="calcbox"><div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#64748b;margin-bottom:6px">Live Costing</div>' +
    (RP.costMode === 'purchase'
      ? '<div class="cr"><span>Purchase cost</span><b>' + INR(c.perPc) + '</b></div>'
      : '<div class="cr"><span>Ingredient cost (batch)</span><b>' + INR(c.ingr) + '</b></div>' +
        '<div class="cr"><span>+ Labour</span><span>' + INR(c.labour) + '</span></div>' +
        '<div class="cr"><span>+ Overhead (gas / bijli)</span><span>' + INR(c.overhead) + '</span></div>' +
        '<div class="cr"><span>+ Packaging (' + QTY(c.yieldQty) + ' × ' + INR(c.packPerPc) + ')</span><span>' + INR(c.packaging) + '</span></div>' +
        '<div class="cr"><span>Batch cost ÷ yield ' + QTY(c.yieldQty) + ' (wastage ' + PCT(c.wastage) + ')</span><b>' + INR(c.perPc) + '</b></div>') +
    '<div class="cr big"><span>Cost per ' + esc(RP.unit || 'pc') + '</span><span style="color:#0b1f33">' + INR(c.perPc) + '</span></div>' +
    '<div class="cr"><span>Selling price ' + (Number(RP.autoPrice) ? '<span class="tag-inline">auto: cost + ' + num(RP.markupPct) + '%</span>' : '<span class="tag-inline">manual</span>') + '</span><span><b>' + INR(sp) + '</b></span></div>' +
    '<div class="cr big"><span>Profit / pc</span><span class="' + (pf >= 0 ? 'pos' : 'neg') + '">' + INR(pf) + ' (' + PCT(margin) + ')</span></div>' +
    '</div>';
}
