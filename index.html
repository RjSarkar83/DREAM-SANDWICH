/* ---------------------------- 1. CREDIT AGEING ---------------------------- */
function ageingRows() {
  const out = [];
  DB.parties.filter(p => p.type !== 'vendor').forEach(p => {
    const credits = DB.sales.filter(s => s.partyId === p.id && s.payMode === 'credit')
      .map(s => ({ date: s.date, amt: num(s.qty) * num(s.rate), inv: s.invNo || '' }))
      .sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
    const paidTotal = (DB.payments || []).filter(x => x.partyId === p.id).reduce((a, x) => a + num(x.amount), 0);
    const openBal = Math.max(0, num(p.opening));
    const grossCredit = credits.reduce((a, c) => a + c.amt, 0) + openBal;
    const unpaid = Math.max(0, grossCredit - paidTotal);
    const ratio = grossCredit > 0 ? Math.min(1, unpaid / grossCredit) : 0;
    const b = { d15: 0, d30: 0, d60: 0, d90: 0 };
    let oldest = '';
    credits.forEach(c => {
      const left = c.amt * ratio;
      if (left <= 0.005) return;
      const age = daysSince(c.date);
      if (age <= 15) b.d15 += left; else if (age <= 30) b.d30 += left; else if (age <= 60) b.d60 += left; else b.d90 += left;
      if (!oldest || c.date < oldest) oldest = c.date;
    });
    if (openBal * ratio > 0.005) { b.d90 += openBal * ratio; if (!oldest) oldest = addDays(TODAY, -400); }
    const total = b.d15 + b.d30 + b.d60 + b.d90;
    if (total <= 0.5) return;
    out.push({
      p: p, total: r2(total), d15: r2(b.d15), d30: r2(b.d30), d60: r2(b.d60), d90: r2(b.d90),
      oldest: oldest, overLimit: num(p.creditLimit) > 0 && total > num(p.creditLimit),
      overdue: r2(b.d60 + b.d90), days: oldest ? daysSince(oldest) : 0
    });
  });
  return out.sort((a, b) => b.total - a.total);
}

function fyClosingSummary() {
  const cashLed = cashLedger('cash'), bankLed = cashLedger('upi');
  const cashClose = num(DB.meta.openingCash) + cashLed.reduce((a, e) => a + e.in - e.out, 0);
  const bankClose = num(DB.meta.openingBank) + bankLed.reduce((a, e) => a + e.in - e.out, 0);
  const recv = outstandingList().reduce((a, o) => a + Math.max(0, o.balance), 0);
  const pay = DB.parties.reduce((a, p) => a + Math.max(0, partyBalance(p.id).payable), 0);
  const st = ingredientStock(), fg = finishedStock();
  const stockVal = r2(DB.ingredients.reduce((a, i) => a + Math.max(0, st[i.id] || 0) * num(i.rate), 0) +
    DB.products.reduce((a, p) => a + Math.max(0, fg[p.id] || 0) * productCost(p).perPc, 0));
  return { cashClose: r2(cashClose), bankClose: r2(bankClose), recv: r2(recv), pay: r2(pay), stockVal: stockVal, st: st, fg: fg };
}

function doFyClose() {
  const s = fyClosingSummary();
  const fy = DB.meta.fy || fyOf(TODAY);
  try { LS.setItem('ds_arch_' + fy, JSON.stringify(DB)); } catch (e) {}
  const nextFy = String(Number(fy.split('-')[0]) + 1) + '-' + String(Number(fy.split('-')[0]) + 2).slice(-2);
  const startDate = addDays(TODAY, 1);
  const st = s.st, fg = s.fg;

  /* carry finished stock as opening production (ye raw material consume karega) */
  const newProd = [];
  DB.products.forEach(p => {
    const q = Math.max(0, fg[p.id] || 0);
    if (q > 0.001) newProd.push({
      id: uid('pr'), date: startDate, productId: p.id, qty: r3(q),
      batches: r3(q / Math.max(0.0001, productCost(p).yieldQty)),
      batchNo: 'OPEN-' + nextFy.slice(0, 4), expiry: addDays(startDate, num(p.shelfLife) || 3), note: 'FY opening stock'
    });
  });
  /* opening production jo raw material khayega — utna raw stock me wapas add karna hoga */
  const consumed = {};
  newProd.forEach(pr => {
    const p = productById(pr.productId);
    if (!p || p.costMode === 'purchase') return;
    (p.recipe && p.recipe.lines || []).forEach(l => {
      consumed[l.ingId] = (consumed[l.ingId] || 0) + lineQty(l, p.recipe) * num(pr.batches);
    });
  });
  const newAdj = [];
  DB.ingredients.forEach(i => {
    const q = Math.max(0, st[i.id] || 0) + (consumed[i.id] || 0);
    if (q > 0.001) newAdj.push({ id: uid('sa'), date: startDate, ingId: i.id, type: 'add', qty: r3(q), reason: 'FY opening', note: fy + ' closing carry' });
    i.opening = 0;   /* master ka purana opening ab stockAdj me carry ho gaya */
  });

  /* party opening = closing balance */
  DB.parties.forEach(p => {
    const b = partyBalance(p.id);
    p.opening = p.type === 'vendor' ? r2(Math.max(0, b.payable)) : r2(Math.max(0, b.receivable));
  });

  DB.sales = []; DB.purchases = []; DB.production = newProd; DB.expenses = []; DB.payments = [];
  DB.orders = []; DB.wastage = []; DB.stockAdj = newAdj; DB.agentDeposits = [];
  DB.attendance = []; DB.advances = []; DB.salaryPaid = []; DB.purchaseOrders = [];
  DB.meta.openingCash = s.cashClose; DB.meta.openingBank = s.bankClose;
  DB.meta.fy = nextFy; DB.meta.invoicePrefix = 'DS/' + nextFy.slice(2) + '/';
  if (!DB.settings) DB.settings = { gstOn: 1 };
  DB.settings.fyClosed = fy;
  DB.settings.lastBackup = TODAY;
  saveDB(); closeModal(); current = 'dashboard'; render();
  toast('FY ' + fy + ' close ho gaya · naya saal ' + nextFy + ' shuru', 'ok');
}

/* ---------------------------- 3. DISCOUNT HELPERS ---------------------------- */
function lineNet(l) {
  const d = num(l.discPct) || 0;
  return num(l.qty) * num(l.rate) * (1 - d / 100);
}

/* ---------------------------- 4. ROUND-OFF ---------------------------- */
function roundOffOn() { return DB.settings && DB.settings.roundOff !== undefined ? !!num(DB.settings.roundOff) : true; }

/* bill lines ko round karke effective rate nikalta hai */
function applyBillRounding(lines, billDisc) {
  let total = lines.reduce((a, l) => a + lineNet(l), 0);
  const disc = Math.min(num(billDisc) || 0, total);
  if (disc > 0 && total > 0) {
    const f = (total - disc) / total;
    lines.forEach(l => { l.rate = num(l.rate) * f; });   /* full precision — revenue exact rahe */
    total = lines.reduce((a, l) => a + lineNet(l), 0);
  }
  const before = total;
  let rounded = false;
  if (roundOffOn() && total > 0) {
    const rTarget = Math.round(total);
    const diff = r2(rTarget - total);
    if (Math.abs(diff) >= 0.01) {
      const big = lines.slice().sort((a, b) => lineNet(b) - lineNet(a))[0];
      if (big && num(big.qty) > 0) {
        const d = num(big.discPct) || 0;
        big.rate = (lineNet(big) + diff) / (1 - d / 100) / num(big.qty);
        rounded = true;
      }
    }
  }
  return { total: r2(lines.reduce((a, l) => a + lineNet(l), 0)), discount: r2(disc), adjusted: rounded, before: r2(before) };
}

function openInvoices(partyId) {
  const map = {};
  DB.sales.filter(s => s.partyId === partyId && s.payMode === 'credit').forEach(s => {
    const k = s.invNo || ('CNT-' + s.date);
    if (!map[k]) map[k] = { inv: k, date: s.date, amt: 0, paid: 0 };
    map[k].amt += num(s.qty) * num(s.rate);
    if (s.date < map[k].date) map[k].date = s.date;
  });
  const pays = (DB.payments || []).filter(p => p.partyId === partyId);
  pays.forEach(p => { if (p.invNo && map[p.invNo]) map[p.invNo].paid += num(p.amount); });
  const list = Object.values(map).filter(r => r.amt - r.paid > 0.5).sort((a, b) => a.date < b.date ? -1 : 1);
  return list;
}

/* invoice-wise ageing (fallback: pro-rata) */
function ageingRowsV2() {
  const out = [];
  DB.parties.filter(p => p.type !== 'vendor').forEach(p => {
    const invs = {};
    DB.sales.filter(s => s.partyId === p.id && s.payMode === 'credit').forEach(s => {
      const k = s.invNo || ('CNT-' + s.date);
      if (!invs[k]) invs[k] = { inv: k, date: s.date, amt: 0, paid: 0 };
      invs[k].amt += num(s.qty) * num(s.rate);
      if (s.date < invs[k].date) invs[k].date = s.date;
    });
    const list = Object.values(invs);
    /* direct bill payments */
    (DB.payments || []).filter(x => x.partyId === p.id && x.invNo && invs[x.invNo]).forEach(x => { invs[x.invNo].paid += num(x.amount); });
    /* baaki payments pro-rata (purana bill pehle) */
    const free = (DB.payments || []).filter(x => x.partyId === p.id && !x.invNo).reduce((a, x) => a + num(x.amount), 0);
    const dues = list.map(r => ({ r: r, left: Math.max(0, r.amt - r.paid) })).filter(o => o.left > 0.005).sort((a, b) => a.r.date < b.r.date ? -1 : 1);
    const totalDue = dues.reduce((a, o) => a + o.left, 0);
    const gross = list.reduce((a, r) => a + r.amt, 0) + Math.max(0, num(p.opening));
    const unallocLeft = Math.max(0, free - Math.max(0, gross - totalDue - Math.max(0, num(p.opening))));
    const freeRatio = totalDue > 0 ? Math.min(1, free / totalDue) : 0;
    void unallocLeft;
    const b = { d15: 0, d30: 0, d60: 0, d90: 0 };
    let oldest = '';
    dues.forEach(o => {
      const left = r2(o.left * (1 - freeRatio));
      if (left <= 0.005) return;
      const age = daysSince(o.r.date);
      if (age <= 15) b.d15 += left; else if (age <= 30) b.d30 += left; else if (age <= 60) b.d60 += left; else b.d90 += left;
      if (!oldest || o.r.date < oldest) oldest = o.r.date;
    });
    const openShare = totalDue + Math.max(0, num(p.opening)) > 0 ? (Math.max(0, num(p.opening)) * (1 - freeRatio)) : 0;
    if (openShare > 0.005) { b.d90 += openShare; if (!oldest) oldest = addDays(TODAY, -400); }
    const total = b.d15 + b.d30 + b.d60 + b.d90;
    if (total <= 0.5) return;
    out.push({
      p: p, total: r2(total), d15: r2(b.d15), d30: r2(b.d30), d60: r2(b.d60), d90: r2(b.d90),
      oldest: oldest, overLimit: num(p.creditLimit) > 0 && total > num(p.creditLimit),
      overdue: r2(b.d60 + b.d90), days: oldest ? daysSince(oldest) : 0,
      bills: dues.length
    });
  });
  return out.sort((a, b) => b.total - a.total);
}

/* ---------------------------- 5. INGREDIENT AGEING ---------------------------- */
function ingredientAgeing() {
  const st = ingredientStock();
  const out = [];
  DB.ingredients.forEach(i => {
    const qty = st[i.id] || 0;
    if (qty <= 0.001) return;
    const buys = [];
    DB.purchases.forEach(pu => (pu.lines || []).forEach(l => { if (l.ingId === i.id) buys.push({ date: pu.date, qty: num(l.qty) }); }));
    buys.sort((a, b) => a.date < b.date ? -1 : 1);
    let acc = 0, oldest = '';
    for (let k = buys.length - 1; k >= 0; k--) {
      acc += buys[k].qty;
      if (acc >= qty - 0.001) { oldest = buys[k].date; break; }
    }
    out.push({ ing: i, qty: r3(qty), value: r2(qty * num(i.rate)), oldest: oldest, age: oldest ? daysSince(oldest) : 0 });
  });
  return out.sort((a, b) => b.age - a.age);
}

function downloadCSV(name, rows) {
  const csv = rows.map(r => r.map(c => '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"').join(',')).join('\n');
  try {
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    toast('CSV download ho gaya', 'ok');
  } catch (e) { copyBox(name, csv); }
}

function gstr1Data(from, to) {
  const rows = DB.sales.filter(s => s.date >= from && s.date <= to && num(s.qty) !== 0);
  const b2b = {}, b2c = {}, hsn = {};
  let totTax = 0;
  rows.forEach(s => {
    const p = productById(s.productId) || {};
    const party = s.partyId ? partyById(s.partyId) : null;
    const g = num(s.gstPct);
    const amt = num(s.qty) * num(s.rate);
    const taxable = amt / (1 + g / 100);
    const tax = amt - taxable;
    totTax += tax;
    const isB2B = !!(party && party.type === 'outlet' && s.invNo);
    const bucket = isB2B ? b2b : b2c;
    bucket[g] = bucket[g] || { rate: g, taxable: 0, tax: 0, count: 0 };
    bucket[g].taxable += taxable; bucket[g].tax += tax; bucket[g].count += 1;
    const h = p.hsn || (p.category || 'OTHER');
    hsn[h] = hsn[h] || { hsn: h, desc: p.name || '', unit: p.unit || 'pc', qty: 0, taxable: 0, tax: 0, rate: g };
    hsn[h].qty += num(s.qty); hsn[h].taxable += taxable; hsn[h].tax += tax;
  });
  return { b2b: Object.values(b2b).sort((a, b) => a.rate - b.rate), b2c: Object.values(b2c).sort((a, b) => a.rate - b.rate), hsn: Object.values(hsn).sort((a, b) => b.taxable - a.taxable), totTax: totTax, lines: rows.length };
}

/* ---------------------------- 1. LOYALTY POINTS ---------------------------- */
const loyaltyPct = () => num((DB.settings && DB.settings.loyaltyPct) !== undefined ? DB.settings.loyaltyPct : 1);
const partyPoints = p => num(p && p.points);

function accruePoints(partyId, billAmt) {
  const p = partyById(partyId);
  if (!p || p.type === 'vendor') return 0;
  const pct = loyaltyPct();
  if (pct <= 0) return 0;
  const pts = Math.floor(num(billAmt) * pct / 100);
  if (pts <= 0) return 0;
  p.points = r2(partyPoints(p) + pts);
  if (!DB.loyalty) DB.loyalty = [];
  DB.loyalty.unshift({ id: uid('ly'), date: TODAY, partyId: p.id, points: pts, type: 'earn', note: 'Bill par points' });
  if (DB.loyalty.length > 500) DB.loyalty = DB.loyalty.slice(0, 500);
  return pts;
}

function redeemPoints(partyId, billAmt) {
  const p = partyById(partyId);
  if (!p) return 0;
  const have = partyPoints(p);
  if (have <= 0) return 0;
  const cap = Math.min(have, Math.floor(num(billAmt) * 0.3));
  if (cap <= 0) return 0;
  p.points = r2(have - cap);
  if (!DB.loyalty) DB.loyalty = [];
  DB.loyalty.unshift({ id: uid('ly'), date: TODAY, partyId: p.id, points: cap, type: 'use', note: 'Bill me use' });
  return cap;
}

function loyaltyCard() {
  const custs = DB.parties.filter(p => p.type !== 'vendor' && partyPoints(p) > 0).sort((a, b) => partyPoints(b) - partyPoints(a));
  const totalPts = custs.reduce((a, p) => a + partyPoints(p), 0);
  return card('🎁 Loyalty Points', 'Retail customer ko bill par points — agle bill me use kar sakte hain', '<span class="badge b-grey">' + custs.length + '</span>',
    (custs.length ? tableHTML([
      { label: 'Customer', render: r => '<b>' + esc(r.name) + '</b><div class="tiny muted">' + esc(r.area || '') + '</div>' },
      { label: 'Points', cls: 'num', render: r => '<b>' + QTY(partyPoints(r)) + '</b>' },

      { label: 'Udhaar', cls: 'num', render: r => INR0(partyBalance(r.id).receivable) }

}

/* ---------------------------- 2. ASSETS & EMI ---------------------------- */
function assetCalc(a) {
  const months = Math.max(0, num(a.tenure));
  const paid = Math.min(months, num(a.paidMonths));
  const emi = num(a.emi);
  return { emi: emi, paid: paid, months: months, paidAmt: r2(paid * emi), remaining: r2(emi * (months - paid)), balance: r2(num(a.cost) - paid * emi) };
}

function autoPostAssets() {
  const cur = monthKey(TODAY);
  let made = 0;
  (DB.assets || []).forEach(a => {
    if (!num(a.active)) return;
    if (monthKey(a.date) >= cur) return;
    if (a.lastPosted === cur) return;
    if (num(a.paidMonths) >= num(a.tenure)) return;
    DB.expenses.push({ id: uid('ex'), date: TODAY, vertical: a.vertical || 'common', category: 'Machine Maintenance', amount: r2(num(a.emi)), note: (a.name || 'Asset') + ' EMI (auto)' });
    a.lastPosted = cur;
    a.paidMonths = num(a.paidMonths) + 1;
    made++;
  });
  if (made) { DB.expenses.sort((a, b) => a.date < b.date ? 1 : -1); saveDB(); }
  return made;
}

function assetModal(id) {
  const a = id ? (DB.assets || []).find(x => x.id === id) : null;
  openForm({
    title: a ? 'Asset edit' : 'Naya Asset / EMI', sub: 'Machine, fridge, oven — EMI har mahine kharcha me jayegi', width: 580,
    values: a || { date: TODAY, tenure: 12, vertical: 'common', active: 1 },
    fields: [
      { key: 'name', label: 'Asset ka naam', type: 'text', placeholder: 'jaise: Deep Freezer 500L' },
      { key: 'date', label: 'Kharida / EMI shuru', type: 'date' },
      { key: 'cost', label: 'Total cost ₹', type: 'text' },
      { key: 'emi', label: 'EMI / mahina ₹', type: 'text', gold: true },
      { key: 'tenure', label: 'Kitne mahine', type: 'text' },
      { key: 'vertical', label: 'Kis vertical ka', type: 'select', options: [{ value: 'bakery', label: 'Bakery' }, { value: 'store', label: 'Store' }, { value: 'supply', label: 'Supply' }, { value: 'common', label: 'Common' }] },
      { key: 'active', label: 'Auto EMI chalu', type: 'select', options: [{ value: 1, label: 'Haan' }, { value: 0, label: 'Nahi' }] }
    ],
    submit: 'Save karein',
    onSubmit: d => {
      if (!d.name.trim() || num(d.emi) <= 0) { toast('Naam aur EMI daalein', 'err'); return false; }
      if (!DB.assets) DB.assets = [];
      const rec = {
        id: a ? a.id : uid('as'), name: d.name.trim(), date: d.date || TODAY, cost: r2(num(d.cost)),
        emi: r2(num(d.emi)), tenure: Math.max(1, num(d.tenure) || 12), vertical: d.vertical,
        paidMonths: a ? num(a.paidMonths) : 0, lastPosted: a ? a.lastPosted : '', active: num(d.active)
      };
      if (a) Object.assign(a, rec); else DB.assets.push(rec);
      saveDB(); logAct('Asset saved', rec.name);
      toast('Asset saved · EMI ' + INR0(rec.emi) + '/mahina', 'ok');
    }
  });
}

function viewAssets() {
  const list = (DB.assets || []).map(a => ({ a: a, c: assetCalc(a) }));
  const emiTotal = list.reduce((x, r) => x + (num(r.a.active) ? r.c.emi : 0), 0);
  const remaining = list.reduce((x, r) => x + r.c.remaining, 0);
  const paid = list.reduce((x, r) => x + r.c.paidAmt, 0);
  return pageHead('Assets & EMI', 'Machine, fridge, oven — EMI auto kharcha me',
      '<button class="btn primary" data-act="newAsset">+ Naya Asset</button>' +
      '<button class="btn" data-act="postEmi">EMI post karein</button>') +
    '<div class="kpis mb">' +
      tile('Monthly EMI', INR0(emiTotal), '<span>' + list.filter(r => num(r.a.active)).length + ' assets chalu</span>', 'red') +
      tile('Ab tak diya', INR0(paid), '<span>EMI se</span>') +
      tile('Bacha hai', INR0(remaining), '<span>' + list.length + ' assets</span>', 'amber') +
      tile('Total cost', INR0(list.reduce((x, r) => x + num(r.a.cost), 0)), '<span>machine + equipment</span>') +
    '</div>' +
    card('Asset register', 'EMI apne aap "Machine Maintenance" kharcha me jati hai', '<span class="badge b-grey">' + list.length + '</span>',
      tableHTML([
        { label: 'Asset', render: r => '<b>' + esc(r.a.name) + '</b><div class="tiny muted">' + (VLABEL[r.a.vertical] || r.a.vertical) + ' · ' + dmy(r.a.date) + '</div>' },
        { label: 'Cost', cls: 'num', render: r => INR(r.a.cost) },
        { label: 'EMI', cls: 'num', render: r => '<b>' + INR(r.c.emi) + '</b><div class="tiny muted">' + r.c.months + ' mahine</div>' },
        { label: 'Diye', cls: 'num', render: r => r.c.paid + ' / ' + r.c.months },
        { label: 'Bacha', cls: 'num', render: r => '<b>' + INR(r.c.remaining) + '</b>' },
        { label: 'Status', cls: 'center', render: r => num(r.a.active) ? '<span class="badge b-green">chalu</span>' : '<span class="badge b-grey">band</span>' },
        { label: '', render: r => '<div style="display:flex;gap:4px;justify-content:flex-end"><button class="btn sm" data-act="editAsset" data-id="' + r.a.id + '">Edit</button><button class="btn sm danger" data-act="delAsset" data-id="' + r.a.id + '">✕</button></div>' }
      ], list, { compact: true, emptyTitle: 'Koi asset add nahi kiya', empty: 'Fridge, oven, mixer — EMI ke saath add karein.' }), { tight: true });
}

/* ---------------------------- 3. PAID LEAVE ---------------------------- */
function leaveSummary(staffId, month) {
  const recs = (DB.attendance || []).filter(a => a.staffId === staffId && monthKey(a.date) === month);
  return {
    P: recs.filter(a => a.status === 'P').length,
    L: recs.filter(a => a.status === 'L').length,
    H: recs.filter(a => a.status === 'H').length,
    A: recs.filter(a => a.status === 'A').length
  };
}

Object.assign(ACT, {
  newAsset: () => assetModal(null),
  editAsset: d => assetModal(d.id),
  delAsset: d => confirmBox('Asset delete karein?', () => {
    DB.assets = (DB.assets || []).filter(x => x.id !== d.id); saveDB(); render(); toast('Asset delete', 'ok');
  }),
  postEmi: () => {
    const n = autoPostAssets();
    render(); toast(n ? n + ' EMI post ho gayi' : 'Is mahine ki EMI pehle se post hai', n ? 'ok' : 'warn');
  },
  attLeave: d => {
    if (!DB.attendance) DB.attendance = [];
    const ex = attOf(d.id, ATT_DATE);
    if (ex) { if (ex.status === 'L') DB.attendance = DB.attendance.filter(a => a !== ex); else ex.status = 'L'; }
    else DB.attendance.push({ id: uid('at'), date: ATT_DATE, staffId: d.id, status: 'L', ot: 0 });
    saveDB(); render();
  },
  saveLoyalty: () => {
    const v = num(($('#loyaltyPct') || {}).value);
    DB.settings.loyaltyPct = Math.max(0, v);
    saveDB(); render(); toast('Loyalty rate save ho gaya · ₹' + DB.settings.loyaltyPct + ' points per ₹100', 'ok');
  }
});

(function boot() {
  const saved = loadDB();
  if (saved) {
    DB = saved;
    if (!DB.meta) DB.meta = { company: 'Dream Sandwich' };
    if (!DB.settings) DB.settings = { gstOn: 1 };
  } else {
    DB = emptyDB();
    saveDB();
  }
  if (!DB.agents) DB.agents = [];
  if (!DB.orders) DB.orders = [];
  if (!DB.wastage) DB.wastage = [];
  if (!DB.stockAdj) DB.stockAdj = [];
  if (!DB.agentDeposits) DB.agentDeposits = [];
  if (!DB.attendance) DB.attendance = [];
  if (!DB.advances) DB.advances = [];
  if (!DB.salaryPaid) DB.salaryPaid = [];
  if (!DB.purchaseOrders) DB.purchaseOrders = [];
  if (!DB.vendorPayments) DB.vendorPayments = [];
  if (!DB.writeOffs) DB.writeOffs = [];
  if (!DB.recurring) DB.recurring = [];
  if (!DB.audit) DB.audit = [];
  if (!DB.assets) DB.assets = [];
  if (!DB.loyalty) DB.loyalty = [];
  if (DB.settings && DB.settings.loyaltyPct === undefined) DB.settings.loyaltyPct = 1;
  if (!DB.settings.pins) DB.settings.pins = { owner: '1234', counter: '0000' };
  if (DB.settings.pinOn === undefined) DB.settings.pinOn = 0;
  applyPeriod('month');
  if (isBlankDB(DB)) current = 'setup';
  renderNav();
  render();
  if (typeof gateNeeded === 'function' && gateNeeded()) openGate();
  if (typeof autoSnapshot === 'function') setTimeout(() => autoSnapshot(), 1500);
  if (typeof autoPostRecurring === 'function') { try { autoPostRecurring(); } catch (e) {} }
  if (typeof autoPostAssets === 'function') { try { autoPostAssets(); } catch (e) {} }
  if (typeof syncSidebar === 'function') { try { syncSidebar(); } catch (e) {} }
  if (LS.__memory) {
    setTimeout(() => toast('Preview mode: data sirf is session tak rahega. File download karke browser me kholein for auto-save.', 'warn'), 900);
  }
})();
</script>
