function productionModal(opts) {
  opts = opts || {};
  if (!DB.products.length) { toast('Pehle product banayein — Bakery → Recipe & Cost', 'err'); current = 'bakeryProducts'; render(); return; }
  openForm({
    title: 'Naya Production Batch', sub: 'Qty daalein — batch aur ingredient consumption auto nikal jayega', width: 620,
    values: { date: TODAY, productId: opts.productId || DB.products[0].id, qty: opts.qty ? String(Math.ceil(num(opts.qty))) : '' },
    fields: [
      { key: 'date', label: 'Date', type: 'date' },
      { key: 'productId', label: 'Product', type: 'select', options: DB.products.map(p => ({ value: p.id, label: p.name })) },
      { key: 'qty', label: 'Banaye gaye pcs', type: 'text', hint: 'Batch = qty ÷ yield' },
      { key: 'note', label: 'Note (optional)', type: 'text', placeholder: 'subah ka batch' }
    ],
    submit: 'Batch save karein',
    onSubmit: d => {
      const p = productById(d.productId);
      const qty = num(d.qty);
      if (!p || qty <= 0) { toast('Product aur qty sahi daalein', 'err'); return false; }
      const yq = Math.max(0.0001, productCost(p).yieldQty);
      const ing = productCost(p).perPc * qty;
      const bd = d.date || TODAY;
      const life = num(p.shelfLife) || 3;
      const seq = DB.production.filter(x => x.productId === p.id && x.date === bd).length + 1;
      DB.production.push({
        id: uid('pr'), date: bd, productId: p.id, qty: qty, batches: r3(qty / yq),
        batchNo: 'B' + bd.slice(8, 10) + bd.slice(5, 7) + '-' + seq, expiry: addDays(bd, life), note: d.note || ''
      });
      DB.production.sort((a, b) => a.date < b.date ? 1 : -1);
      saveDB();
      toast(qty + ' pcs ' + p.name + ' ka batch add hua · expiry ' + dmy(addDays(bd, life)), 'ok');
    }
  });
}

/* ---------------- SALES (bakery / store / supply shared) ---------------- */
function viewSales(channel) {
  const ch = CHANNELS.find(c => c.id === channel) || CHANNELS[0];
  const all = DB.sales.filter(s => s.channel === channel);
  const rows = all.filter(s => s.date >= P.from && s.date <= P.to);
  const amount = rows.reduce((a, s) => a + num(s.qty) * num(s.rate), 0);
  const tax = rows.reduce((a, s) => a + num(s.qty) * num(s.rate) - num(s.qty) * num(s.rate) / (1 + num(s.gstPct) / 100), 0);
  const cost = rows.reduce((a, s) => a + productCost(productById(s.productId)).perPc * num(s.qty), 0);
  const credit = rows.filter(s => s.payMode === 'credit').reduce((a, s) => a + num(s.qty) * num(s.rate), 0);
  const avgBill = rows.length ? amount / rows.length : 0;
  const prodMap = {};
  rows.forEach(s => prodMap[s.productId] = (prodMap[s.productId] || 0) + num(s.qty));
  const topP = Object.keys(prodMap).sort((a, b) => prodMap[b] - prodMap[a])[0];

  const isSupply = channel === 'supply';
  const show = rows.slice(0, 120);

  return pageHead(ch.label + (isSupply ? ' — Bills & Supply' : ' — ' + ch.sub),
      periodLabel() + ' · ' + rows.length + ' entries' + (isSupply ? ' · GST bill aur udhaar dono manage karein' : ''),
      '<button class="btn" data-act="newReturn">← Return</button>' +
      '<button class="btn" data-act="quickExpense">+ Kharcha</button>' +
      '<button class="btn gold" data-act="newSale" data-ch="' + channel + '">+ Naya ' + (isSupply ? 'Supply Bill' : 'Sale') + '</button>') +

    '<div class="kpis mb">' +
      tile('Sales (GST sahit)', INR0(amount), '<span>GST ' + INR0(tax) + ' included</span>', channel === 'bakery' ? 'amber' : channel === 'store' ? 'teal' : 'indigo') +
      tile('Cost of Goods', INR0(cost), '<span>Recipe cost ke hisaab se</span>', 'red') +
      tile('Gross Profit', INR0(amount - tax - cost), '<span class="badge b-' + (amount - tax - cost >= 0 ? 'green' : 'red') + '">' + PCT(amount - tax ? (amount - tax - cost) / (amount - tax) * 100 : 0) + '</span>', 'green') +
      tile(isSupply ? 'Udhaar diya' : 'Cash + UPI', isSupply ? INR0(credit) : INR0(amount - credit), '<span>' + (isSupply ? 'Party se lena hai' : 'Turant mila') + '</span>', isSupply ? 'red' : 'teal') +
      tile('Average Bill', INR0(avgBill), '<span>' + (topP ? 'Top: ' + esc((productById(topP) || {}).name || '') : '') + '</span>', 'navy') +
    '</div>' +

    card(isSupply ? 'Supply Bills' : 'Sale Entries',
      isSupply ? 'Bill print karke outlet ko dein · udhaar automatically party khate me jata hai' : 'Counter ki daily sales',
      '<input class="btn" style="width:180px;cursor:text" placeholder="Search product / party" oninput="filterSaleRows(this.value)">',
      '<div id="salesTableWrap">' + salesTable(channel, show) + '</div>', { tight: true });
}

function filterSaleRows(q) {
  const wrap = $('#salesTableWrap');
  if (!wrap) return;
  const ch = current === 'supplyOrders' ? 'supply' : current === 'storeSales' ? 'store' : 'bakery';
  const qq = String(q || '').toLowerCase();
  const rows = DB.sales.filter(s => s.channel === ch && s.date >= P.from && s.date <= P.to)
    .filter(s => {
      if (!qq) return true;
      const p = productById(s.productId) || {};
      const pa = partyById(s.partyId) || {};
      return (p.name || '').toLowerCase().includes(qq) || (pa.name || '').toLowerCase().includes(qq) || (s.invNo || '').toLowerCase().includes(qq);
    }).slice(0, 150);
  wrap.innerHTML = salesTable(ch, rows);
}

function readSaleForm() {
  $$('#modalRoot .slF').forEach(el => SL[el.dataset.k] = el.value);
  $$('#modalRoot .slProd').forEach(el => { const i = +el.dataset.i; if (SL.lines[i]) SL.lines[i].productId = el.value; });
  $$('#modalRoot .slQty').forEach(el => { const i = +el.dataset.i; if (SL.lines[i]) SL.lines[i].qty = el.value; });
  $$('#modalRoot .slRate').forEach(el => { const i = +el.dataset.i; if (SL.lines[i]) SL.lines[i].rate = el.value; });
  $$('#modalRoot .slDisc').forEach(el => { const i = +el.dataset.i; if (SL.lines[i]) SL.lines[i].discPct = el.value; });
}
function bindSale() {
  $$('#modalRoot .slF').forEach(el => el.addEventListener('change', () => {
    readSaleForm();
    if (el.dataset.k === 'channel') {
      SL.lines.forEach(l => { const p = productById(l.productId); if (p) l.rate = partyRate(SL.partyId, p, SL.channel); });
      if (SL.channel === 'supply' && SL.payMode === 'cash') SL.payMode = 'credit';
      drawSale(); return;
    }
    if (el.dataset.k === 'partyId') {
      SL.lines.forEach(l => { const p = productById(l.productId); if (p) l.rate = partyRate(SL.partyId, p, SL.channel); });
      drawSale(); return;
    }
    updateSaleTotals();
  }));
  $$('#modalRoot .slProd').forEach(el => el.addEventListener('change', () => {
    const i = +el.dataset.i;
    const p = productById(el.value);
    if (p && SL.lines[i]) { SL.lines[i].productId = el.value; SL.lines[i].rate = partyRate(SL.partyId, p, SL.channel); }
    readSaleForm(); drawSale();
  }));
  $$('#modalRoot .slQty, #modalRoot .slRate, #modalRoot .slDisc').forEach(el => el.addEventListener('input', () => {
    readSaleForm();
    $$('#modalRoot .slAmt').forEach(a => { const i = +a.dataset.i; const l = SL.lines[i]; if (l) a.value = r2(lineNet(l)); });
    updateSaleTotals();
  }));
  const save = print => {
    readSaleForm();
    const valid = SL.lines.filter(l => l.productId && num(l.qty) > 0);
    if (!valid.length) { toast('Kam se kam ek item daalein', 'err'); return; }
    if (SL.channel === 'supply' && !SL.partyId) { toast('Supply bill ke liye party chunna zaroori hai', 'err'); return; }
    if (SL.payMode === 'credit' && !SL.partyId) { toast('Udhaar ke liye party chunna zaroori hai', 'err'); return; }
    const inv = SL.channel === 'supply' ? nextInvNo() : '';
    const work = valid.map(l => ({ productId: l.productId, qty: num(l.qty), rate: num(l.rate), discPct: num(l.discPct) || 0 }));
    const preTotal = work.reduce((a, l) => a + lineNet(l), 0);
    const ptsUsed = (String(SL.usePoints) === '1' && typeof redeemPoints === 'function') ? redeemPoints(SL.partyId, preTotal) : 0;
    const calc = applyBillRounding(work, num(SL.billDisc) + ptsUsed);
    work.forEach(l => {
      const p = productById(l.productId);
      DB.sales.push({
        id: uid('sl'), date: SL.date || TODAY, channel: SL.channel, productId: l.productId,
        qty: l.qty, rate: l.rate, partyId: SL.partyId || '', payMode: SL.payMode,
        discPct: l.discPct, gstPct: p ? num(p.gstPct) : 0, invNo: inv,
        billDisc: calc.discount || 0, rounded: calc.adjusted ? 1 : 0
      });
    });
    SL.billDisc = '';
    const ptsEarned = (typeof accruePoints === 'function') ? accruePoints(SL.partyId, calc.total) : 0;
    if (ptsUsed || ptsEarned) logAct('Loyalty', (ptsUsed ? 'use ' + ptsUsed + ' ' : '') + (ptsEarned ? 'earn ' + ptsEarned : ''));
    SL.usePoints = '0';
    DB.sales.sort((a, b) => a.date < b.date ? 1 : -1);
    saveDB();
    const amt = calc.total;
    if (SL.payMode === 'credit' && SL.partyId) {
      const pt = partyById(SL.partyId);
      const bal = partyBalance(SL.partyId).receivable;
      if (pt && num(pt.creditLimit) > 0 && bal > num(pt.creditLimit)) {
        toast('⚠️ ' + pt.name + ' ki limit cross: baki ' + INR0(bal) + ' / limit ' + INR0(pt.creditLimit), 'warn');
      }
    }
    toast('Sale saved: ' + INR0(amt) + (inv ? ' · ' + inv : ''), 'ok');
    closeModal();
    if (print && inv) { printInvoice(inv); }
    render();
  };
  $('#slSave').onclick = () => save(false);
  if ($('#slSavePrint')) $('#slSavePrint').onclick = () => save(true);
  if (typeof bindScan === 'function') bindScan();
}

function updateSaleTotals() {
  const box = $('#slTotals');
  if (!box) return;
  let gross = 0, tax = 0, disc = 0;
  SL.lines.forEach(l => {
    const p = productById(l.productId);
    const amt = lineNet(l);
    const raw = num(l.qty) * num(l.rate);
    disc += raw - amt;
    gross += amt;
    const g = p ? num(p.gstPct) : 0;
    tax += amt - amt / (1 + g / 100);
  });
  const billDisc = Math.min(num(SL.billDisc) || 0, gross);
  const afterBill = gross - billDisc;
  const roundTarget = (typeof roundOffOn === 'function' && roundOffOn() && afterBill > 0) ? Math.round(afterBill) : afterBill;
  const roundDiff = r2(roundTarget - afterBill);
  const party = SL.partyId ? partyById(SL.partyId) : null;
  const bal = party ? partyBalance(party.id).receivable : 0;
  box.innerHTML =
    '<div class="calcbox">' +
      '<div class="cr"><span>Total items</span><span>' + SL.lines.filter(l => num(l.qty) > 0).length + '</span></div>' +
      (disc > 0.01 ? '<div class="cr"><span>Item discount</span><span>' + INR(disc) + '</span></div>' : '') +
      (billDisc > 0.01 ? '<div class="cr"><span>Bill discount</span><span>' + INR(billDisc) + '</span></div>' : '') +
      '<div class="cr"><span>Taxable value (GST chhod ke)</span><span>' + INR(gross - tax) + '</span></div>' +
      '<div class="cr"><span>GST (included)</span><span>' + INR(tax) + '</span></div>' +
      (Math.abs(roundDiff) >= 0.01 ? '<div class="cr"><span>Round off</span><span>' + (roundDiff > 0 ? '+' : '') + r2(roundDiff) + '</span></div>' : '') +
      '<div class="cr big"><span>Bill total</span><span>' + INR(roundTarget) + '</span></div>' +
      (party ? '<div class="cr"><span>' + esc(party.name) + ' ka purana udhaar</span><span class="' + (bal > 0 ? 'neg' : '') + '">' + INR(bal) + '</span></div>' : '') +
    '</div>';
}

function nextInvNo() {
  const nums = DB.sales.filter(s => s.invNo).map(s => parseInt(String(s.invNo).split('/').pop(), 10)).filter(n => !isNaN(n));
  const n = (nums.length ? Math.max.apply(null, nums) : 0) + 1;
  return (DB.meta.invoicePrefix || 'DS/') + String(n).padStart(4, '0');
}

function printInvoice(invNo) {
  const lines = DB.sales.filter(s => s.invNo === invNo);
  if (!lines.length) { toast('Bill nahi mila', 'err'); return; }
  const party = partyById(lines[0].partyId);
  const m = DB.meta;
  let gross = 0, tax = 0;
  const items = lines.map((s, i) => {
    const p = productById(s.productId) || { name: '-', unit: 'pc' };
    const amt = num(s.qty) * num(s.rate);
    const g = num(s.gstPct);
    const taxable = amt / (1 + g / 100);
    gross += amt; tax += amt - taxable;
    return '<tr><td>' + (i + 1) + '</td><td>' + esc(p.name) + '</td><td>' + esc(p.unit || 'pc') + '</td>' +
      '<td style="text-align:right">' + QTY(s.qty) + '</td><td style="text-align:right">' + r2(s.rate) + '</td>' +
      '<td style="text-align:right">' + g + '%</td><td style="text-align:right">' + r2(taxable) + '</td>' +
      '<td style="text-align:right">' + r2(amt - taxable) + '</td><td style="text-align:right"><b>' + r2(amt) + '</b></td></tr>';

      '<div class="right"><div style="font-size:15px;font-weight:700;letter-spacing:.06em">TAX INVOICE</div>' +
      '<div>No: <b>' + esc(invNo) + '</b></div><div>Date: ' + dmy(lines[0].date) + '</div><div>State: ' + esc(m.state) + '</div>' +
      (typeof barcodeSVG === 'function' ? '<div style="margin-top:6px">' + barcodeSVG(invNo, { height: 38, unit: 1.2 }) + '</div>' : '') + '</div></div>' +
      '<div style="display:flex;gap:16px;margin-top:12px">' +
        '<div style="flex:1;border:1px solid #dbe2ea;padding:8px 10px;border-radius:4px">' +
          '<div style="font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:#666">Bill To</div>' +
          '<div style="font-weight:700;margin-top:2px">' + esc(party ? party.name : 'Counter Customer') + '</div>' +
          '<div style="font-size:11px;color:#444">' + esc(party ? (party.area || '') : '') + (party && party.phone ? '<br>' + esc(party.phone) : '') + '</div></div>' +
        '<div style="flex:1;border:1px solid #dbe2ea;padding:8px 10px;border-radius:4px">' +
          '<div style="font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:#666">Payment</div>' +
          '<div style="font-weight:700;margin-top:2px">' + (lines[0].payMode === 'credit' ? 'Udhaar / Credit' : lines[0].payMode === 'upi' ? 'UPI / Bank' : 'Cash') + '</div>' +
          '<div style="font-size:11px;color:#444">Credit days: ' + (party ? num(party.creditDays) + ' din' : '—') + '</div></div>' +
      '</div>' +
      '<table><thead><tr><th>#</th><th>Item</th><th>Unit</th><th style="text-align:right">Qty</th><th style="text-align:right">Rate</th><th style="text-align:right">GST</th><th style="text-align:right">Taxable</th><th style="text-align:right">GST Amt</th><th style="text-align:right">Total</th></tr></thead>' +
      '<tbody>' + items + '</tbody></table>' +
      '<div class="tot">' +
        (lines.some(s => num(s.discPct) > 0) ? '<div><span>Discount diya</span><span>' + lines.filter(s => num(s.discPct) > 0).map(s => QTY(s.discPct) + '%').join(', ') + '</span></div>' : '') +
        '<div><span>Taxable value</span><span>' + INR(gross - tax) + '</span></div>' +

    foot: '<button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" id="puSave">Purchase save karein</button>'
  });
  const read = () => {
    $$('#modalRoot .puF').forEach(el => PU[el.dataset.k] = el.type === 'checkbox' ? (el.checked ? 1 : 0) : el.value);
    $$('#modalRoot .puIng').forEach(el => { const i = +el.dataset.i; if (PU.lines[i]) PU.lines[i].ingId = el.value; });
    $$('#modalRoot .puQty').forEach(el => { const i = +el.dataset.i; if (PU.lines[i]) PU.lines[i].qty = el.value; });
    $$('#modalRoot .puRate').forEach(el => { const i = +el.dataset.i; if (PU.lines[i]) PU.lines[i].rate = el.value; });
  };
  const totals = () => {
    const t = PU.lines.reduce((a, l) => a + num(l.qty) * num(l.rate), 0);
    $('#puTotals').innerHTML = '<div class="calcbox">' +
      '<div class="cr"><span>Total items</span><span>' + PU.lines.length + '</span></div>' +
      '<div class="cr big"><span>Bill total</span><span>' + INR(t) + '</span></div></div>';
  };

  $$('#modalRoot .puIng').forEach(el => el.addEventListener('change', () => {
    const i = +el.dataset.i; const ing = ingById(el.value);
    if (ing && PU.lines[i]) { PU.lines[i].ingId = el.value; PU.lines[i].rate = ing.rate; }
    read(); drawPurchase();
  }));
  $$('#modalRoot .puQty, #modalRoot .puRate').forEach(el => el.addEventListener('input', () => {
    read();
    $$('#modalRoot .puAmt').forEach(a => { const i = +a.dataset.i; const l = PU.lines[i]; if (l) a.value = r2(num(l.qty) * num(l.rate)); });

    read();

    if (!valid.length) { toast('Kam se kam ek item daalein', 'err'); return; }
    const amount = valid.reduce((a, l) => a + num(l.qty) * num(l.rate), 0);
    DB.purchases.push({
      id: uid('pu'), date: PU.date || TODAY, partyId: PU.partyId,
      lines: valid.map(l => ({ ingId: l.ingId, qty: num(l.qty), rate: num(l.rate) })),
      amount: r2(amount), paidAmount: PU.payMode === 'credit' ? 0 : r2(amount),
      payMode: PU.payMode, note: '', poId: PU.poId || ''
    });
    if (PU.updateRate) valid.forEach(l => { const ing = ingById(l.ingId); if (ing) ing.rate = num(l.rate); });
    DB.purchases.sort((a, b) => a.date < b.date ? 1 : -1);
    saveDB(); closeModal(); render();
    toast('Purchase saved · ' + INR0(amount) + ' · stock update ho gaya', 'ok');
  };
}

/* ================= REPORTS ================= */
function exportCSV(name, headers, rows) {
  const csv = [headers.join(',')].concat(rows.map(r => r.map(v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"').join(','))).join('\n');
  try {
    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    toast('CSV download ho gaya: ' + name, 'ok');
  } catch (e) { toast('Download block hai — file browser me kholein', 'warn'); }
}

const plCell = (v, bold) => '<td class="num">' + (bold ? '<b>' : '') + (v < 0 ? '<span class="neg">' + money(v) + '</span>' : INR(v)) + (bold ? '</b>' : '') + '</td>';
const pctCell = v => '<td class="num"><span class="badge b-' + (v >= 20 ? 'green' : v >= 8 ? 'amber' : v >= 0 ? 'grey' : 'red') + '">' + PCT(v) + '</span></td>';

function viewReportPnl() {
  const pl = plFor(P.from, P.to);
  const ch = CHANNELS.map(c => pl.channels[c.id]);
  const tot = pl.total;
  const sum = a => a.reduce((x, y) => x + y, 0);
  const row = (label, vals, opt) => {
    opt = opt || {};
    const cls = opt.strong ? 'hl-green' : '';
    let html = '<tr class="' + cls + '"><td>' + (opt.strong ? '<b>' + label + '</b>' : opt.sub ? '&nbsp;&nbsp;<span class="muted">' + label + '</span>' : label) + '</td>';
    vals.forEach(v => { html += plCell(v, opt.strong); });
    html += plCell(opt.total !== undefined ? opt.total : sum(vals), true) + '</tr>';
    return html;
  };
  const pctRow = (label, vals, total) => '<tr><td class="muted">' + label + '</td>' + vals.map(v => pctCell(v)).join('') + pctCell(total || 0) + '</tr>';

  const rev = ch.map(c => c.taxable);
  const commonAlloc = ch.map(c => c.commonShare);

  const mainTable =
    '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Particulars</th>' +
    CHANNELS.map(c => '<th class="right"><span class="dot ' + c.cls + '"></span> ' + c.label + '</th>').join('') +
    '<th class="right">TOTAL</th></tr></thead><tbody>' +
    row('Sales (GST sahit)', ch.map(c => c.sales)) +
    row('Less: GST collected', ch.map(c => -c.gst), { sub: true }) +
    row('Net Sales / Revenue', rev, { strong: true }) +
    row('Less: Material cost (COGS)', ch.map(c => -c.cogs), { sub: true }) +
    row('GROSS PROFIT', ch.map(c => c.gross), { strong: true }) +
    pctRow('Gross margin %', ch.map(c => c.grossMarginPct), tot.taxable ? tot.gross / tot.taxable * 100 : 0) +
    row('Less: Wastage / Damage', ch.map(c => -c.wastage), { sub: true }) +
    row('Less: Business kharche', ch.map(c => -c.expenses), { sub: true }) +
    row('CHANNEL PROFIT', ch.map(c => c.profit), { strong: true }) +
    row('Less: Common kharche (revenue share)', commonAlloc.map(v => -v), { sub: true }) +
    row('NET PROFIT', ch.map(c => c.profitAfterCommon), { strong: true }) +
    pctRow('Net margin %', ch.map(c => c.netMarginPct), tot.netMarginPct) +
    '</tbody><tfoot><tr><td><b>TOTAL (sab vertical)</b></td><td class="num" colspan="3"><b>Revenue ' + INR(rev.reduce((a, b) => a + b, 0)) + '</b></td>' +
    '<td class="num"><b class="' + (tot.net >= 0 ? 'pos' : 'neg') + '">' + money(tot.net) + '</b></td></tr></tfoot></table></div>';

  /* expense breakdown by category */
  const cats = {};
  CHANNELS.forEach(c => {
    Object.keys(pl.channels[c.id].expCats).forEach(k => {
      cats[k] = cats[k] || { bakery: 0, store: 0, supply: 0, common: 0 };
      cats[k][c.id] += pl.channels[c.id].expCats[k];
    });
  });
  Object.keys(pl.common.expCats).forEach(k => { cats[k] = cats[k] || { bakery: 0, store: 0, supply: 0, common: 0 }; cats[k].common += pl.common.expCats[k]; });
  const catKeys = Object.keys(cats).sort((a, b) => {
    const sa = cats[a].bakery + cats[a].store + cats[a].supply + cats[a].common;
    const sb = cats[b].bakery + cats[b].store + cats[b].supply + cats[b].common;
    return sb - sa;
  });
  const expTable = tableHTML([
    { label: 'Kharche ki category', render: r => '<b>' + esc(r.k) + '</b>' },
    { label: 'Bakery', cls: 'num', render: r => r.v.bakery ? INR0(r.v.bakery) : '—' },
    { label: 'Store', cls: 'num', render: r => r.v.store ? INR0(r.v.store) : '—' },
    { label: 'Supply', cls: 'num', render: r => r.v.supply ? INR0(r.v.supply) : '—' },
    { label: 'Common', cls: 'num', render: r => r.v.common ? INR0(r.v.common) : '—' },
    { label: 'Total', cls: 'num', render: r => '<b>' + INR0(r.v.bakery + r.v.store + r.v.supply + r.v.common) + '</b>' }
  ], catKeys.map(k => ({ k, v: cats[k] })), {
    compact: true, emptyTitle: 'Is period me koi kharcha nahi',
    foot: '<tr><td>Total</td><td class="num">' + INR0(ch[0].expenses) + '</td><td class="num">' + INR0(ch[1].expenses) + '</td><td class="num">' + INR0(ch[2].expenses) + '</td><td class="num">' + INR0(pl.common.expenses) + '</td><td class="num"><b>' + INR0(tot.expenses) + '</b></td></tr>'
  });

  /* comparison bars */
  const maxRev = Math.max.apply(null, rev.concat([1]));
  const bars = CHANNELS.map((c, i) => {
    const r = pl.channels[c.id];
    return '<div style="margin-bottom:12px">' +
      '<div style="display:flex;justify-content:space-between;font-size:12.6px"><span><span class="dot ' + c.cls + '"></span> <b>' + c.label + '</b></span>' +
      '<span>Rev ' + INR0(r.taxable) + ' · Profit <b class="' + (r.profitAfterCommon >= 0 ? 'pos' : 'neg') + '">' + INR0(r.profitAfterCommon) + '</b></span></div>' +
      '<div class="tracker" style="height:9px;margin-top:4px">' +
        '<i style="width:' + (r.cogs / maxRev * 100).toFixed(1) + '%;background:#f0a9a9" title="cost"></i>' +
        '<i style="width:' + (r.expenses / maxRev * 100).toFixed(1) + '%;background:#f3cf8e" title="kharche"></i>' +
        '<i style="width:' + (Math.max(0, r.profitAfterCommon) / maxRev * 100).toFixed(1) + '%;background:#7fd0a0" title="profit"></i>' +
      '</div>' +
      '<div class="tiny muted">Cost ' + INR0(r.cogs) + ' · Kharche ' + INR0(r.expenses + r.commonShare) + ' · Profit ' + INR0(r.profitAfterCommon) + ' (' + PCT(r.netMarginPct) + ')</div>' +
    '</div>';
  }).join('');

  return pageHead('Profit & Loss — Vertical wise', periodLabel() + ' · GST alag, revenue ex-GST me',
      '<button class="btn" data-act="nav" data-view="reportProduct">Product wise</button>' +
      '<button class="btn" data-act="printReport" data-title="Profit &amp; Loss Statement">🖨 Print</button>' +
      '<button class="btn" id="csvPnl">⬇ CSV</button>') +

    '<div class="kpis mb">' +
      tile('Revenue (ex-GST)', INR0(tot.taxable), '<span>' + tot.bills + ' bills</span>', 'navy') +
      tile('Gross Profit', INR0(tot.gross), '<span class="badge b-green">' + PCT(tot.taxable ? tot.gross / tot.taxable * 100 : 0) + '</span>', 'teal') +
      tile('Total Kharche', INR0(tot.expenses), '<span>Business + common</span>', 'amber') +
      tile('Net Profit', money(tot.net), '<span class="badge b-' + (tot.net >= 0 ? 'green' : 'red') + '">' + PCT(tot.netMarginPct) + ' net margin</span>', tot.net >= 0 ? 'green' : 'red') +
      tile('GST Payable', INR0(pl.total.gst), '<span>Output tax collected</span>', 'indigo') +
    '</div>' +

    card('Profit & Loss Statement', 'Tally style · teeno business alag column me', '', mainTable, { tight: true }) +

    '<div class="grid cols-2-1 mt">' +
      card('Kharche ki puri list', 'Vertical-wise breakup', '', expTable, { tight: true }) +
      card('Revenue vs Cost vs Profit', 'Bar jitni badi, raqam utni zyada', '', bars) +
    '</div>';
}

/* ---------------- PARTY LEDGER ---------------- */
function viewReportParty() {
  const outs = buyers().map(p => {
    const b = partyBalance(p.id).receivable;
    const sales = DB.sales.filter(s => s.partyId === p.id).reduce((a, s) => a + num(s.qty) * num(s.rate), 0);
    const paid = DB.payments.filter(x => x.partyId === p.id).reduce((a, x) => a + num(x.amount), 0);
    return { party: p, balance: b, sales, paid, overLimit: num(p.creditLimit) > 0 && b > num(p.creditLimit) };
  }).sort((a, b) => b.balance - a.balance);
  const totalRec = outs.reduce((a, o) => a + o.balance, 0);
  const vens = vendors().map(p => {
    const b = partyBalance(p.id).payable;
    const pur = DB.purchases.filter(x => x.partyId === p.id).reduce((a, x) => a + num(x.amount), 0);
    return { party: p, payable: b, purchase: pur };
  }).sort((a, b) => b.payable - a.payable);
  const totalPay = vens.reduce((a, v) => a + v.payable, 0);

  return pageHead('Party Ledger / Udhaar Khata', 'Customer se lena hai aur vendor ko dena hai — dono ka hisaab',
      '<button class="btn" data-act="nav" data-view="supplyPayments">Payment entry</button>' +

    '<div class="kpis mb">' +
      tile('Customers se Lena Hai', INR0(totalRec), '<span class="badge b-red">' + outs.filter(o => o.balance > 0).length + ' party</span>', 'red') +
      tile('Vendors ko Dena Hai', INR0(totalPay), '<span class="badge b-amber">' + vens.filter(v => v.payable > 0).length + ' vendor</span>', 'amber') +
      tile('Net Position', money(totalRec - totalPay), '<span>' + (totalRec - totalPay >= 0 ? 'Aapko milna hai' : 'Aapko dena hai') + '</span>', totalRec - totalPay >= 0 ? 'green' : 'red') +
    '</div>' +

    card('Outlets / Customers', 'Udhaar, receipt aur limit',
      '<span class="badge b-navy">' + outs.length + '</span>',
      tableHTML([
        { label: 'Party', render: r => '<b>' + esc(r.party.name) + '</b> <span class="badge b-grey">' + (r.party.type === 'customer' ? 'Customer' : 'Outlet') + '</span><div class="tiny muted">' + esc(r.party.area || '') + ' · ' + esc(r.party.phone || '') + '</div>' },
        { label: 'Total Sales', cls: 'num', render: r => INR0(r.sales) },
        { label: 'Received', cls: 'num', render: r => INR0(r.paid) },
        { label: 'Credit Days', cls: 'num', render: r => num(r.party.creditDays) + 'd' },
        { label: 'Baki (Dr)', cls: 'num', render: r => '<b class="' + (r.balance > 0 ? 'neg' : 'pos') + '">' + INR(r.balance) + '</b>' + (r.overLimit ? ' <span class="badge b-red">limit+</span>' : '') },
        { label: '', render: r => '<div style="display:flex;gap:5px;justify-content:flex-end">' +
            '<button class="btn sm" data-act="openLedger" data-id="' + r.party.id + '">Ledger</button>' +
            '<button class="btn sm" data-act="newPayment" data-party="' + r.party.id + '">₹</button>' +
            '<button class="btn sm" data-act="editParty" data-id="' + r.party.id + '">Edit</button></div>' }
      ], outs, { compact: true }), { tight: true }) +

    '<div class="mt">' + card('Vendors / Suppliers', 'Kharid aur payable',

/* ---------------- STOCK ---------------- */
function viewReportStock() {
  const rows = stockRows();
  const low = rows.filter(r => r.status !== 'ok');
  const totalVal = rows.reduce((a, r) => a + r.value, 0);
  const fg = finishedStock();
  const fgRows = DB.products.map(p => ({ p, qty: Math.max(0, fg[p.id] || 0), cost: productCost(p).perPc, value: Math.max(0, fg[p.id] || 0) * productCost(p).perPc }))
    .filter(r => r.qty > 0).sort((a, b) => b.value - a.value);
  const fgVal = fgRows.reduce((a, r) => a + r.value, 0);

  /* period consumption */
  const cons = {};
  DB.production.filter(pr => pr.date >= P.from && pr.date <= P.to).forEach(pr => {
    const p = productById(pr.productId);
    if (!p) return;
    (p.recipe.lines || []).forEach(l => cons[l.ingId] = (cons[l.ingId] || 0) + lineQty(l, p.recipe) * num(pr.batches));

  return pageHead('Stock Summary', 'Raw material + finished goods · value aur low-stock alerts',
      '<button class="btn" data-act="printReport" data-title="Stock Summary">🖨 Print</button>' +

    '<div class="kpis mb">' +
      tile('Raw Material Value', INR0(totalVal), '<span>' + rows.length + ' items</span>', 'navy') +
      tile('Finished Goods Value', INR0(fgVal), '<span>' + fgRows.length + ' products</span>', 'teal') +
      tile('Total Stock Value', INR0(totalVal + fgVal), '<span>Balance sheet item</span>', 'green') +
      tile('Low / Out of Stock', low.length, '<span class="badge b-' + (low.length ? 'red' : 'green') + '">' + (low.length ? 'order karein' : 'sab theek') + '</span>', low.length ? 'red' : 'green') +

    card('Raw Material Stock', 'Opening + purchase − production consumption',
      '<input class="btn" style="width:170px;cursor:text" placeholder="Search item" oninput="filterStockTable(this.value)">',
      '<div id="stockWrap">' + stockTableHTML(rows, cons) + '</div>', { tight: true }) +

    '<div class="mt">' + card('Finished Goods (taiyaar maal)', 'Production − sales', '',
      tableHTML([
        { label: 'Product', render: r => '<b>' + esc(r.p.name) + '</b>' },
        { label: 'Stock', cls: 'num', render: r => QTY(r.qty) + ' ' + esc(r.p.unit || 'pc') },

        { label: 'Value', cls: 'num', render: r => '<b>' + INR(r.value) + '</b>' },

/* ---------------- GST ---------------- */
function viewReportGst() {
  const g = gstSummary(P.from, P.to);
  const months = {};
  DB.sales.filter(s => s.date >= P.from && s.date <= P.to).forEach(s => {
    const k = monthKey(s.date);
    const amt = num(s.qty) * num(s.rate);
    const gg = num(s.gstPct);
    const m = months[k] || (months[k] = { taxable: 0, tax: 0 });
    m.taxable += amt / (1 + gg / 100);
    m.tax += amt - amt / (1 + gg / 100);
  });

  return pageHead('GST Summary', periodLabel() + ' · GST included pricing ka breakup',
      '<button class="btn" data-act="printReport" data-title="GST Summary">🖨 Print</button>' +
      '<button class="btn" id="csvGst">⬇ CSV</button>') +
    '<div class="kpis mb">' +
      tile('Taxable Value', INR0(g.output ? g.rows.reduce((a, r) => a + r.taxable, 0) : 0), '<span>' + g.rows.length + ' GST slabs</span>', 'navy') +
      tile('Output GST', INR0(g.output), '<span>Sales par GST</span>', 'amber') +
      tile('Input GST', INR0(g.input), '<span>Purchase par GST</span>', 'teal') +
      tile('Net GST Payable', INR0(g.net), '<span class="badge b-red">Sarkar ko dena hai</span>', 'red') +
    '</div>' +
    '<div class="grid cols-2">' +
      card('Slab wise breakup', 'Har GST rate ka alag hisaab', '',
        tableHTML([
          { label: 'GST Rate', render: r => '<b>' + r.rate + '%</b>' },
          { label: 'Taxable Value', cls: 'num', render: r => INR(r.taxable) },
          { label: 'CGST', cls: 'num', render: r => INR(r.tax / 2) },
          { label: 'SGST', cls: 'num', render: r => INR(r.tax / 2) },
          { label: 'Total Tax', cls: 'num', render: r => '<b>' + INR(r.tax) + '</b>' },

        }), { tight: true }) +

        tableHTML([

/* ================= BAHI KHATA — DOUBLE ENTRY LEDGER ================= */
/* Har transaction do side me post hota hai (Debit + Credit) — isliye trial balance hamesha match karta hai. */

let BK = { acc: 'cash' };
const EXP_ACC_ID = cat => 'exp_' + String(cat || 'other').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
const GROUP_LABEL = { cash: 'Cash & Bank', debtor: 'Parties — aapko lena hai', agent: 'Agents — cash in hand', creditor: 'Vendors — aapko dena hai', income: 'Income (Sales)', expense: 'Expenses', gst: 'Tax', equity: 'Opening' };

function accountsList() {
  const list = [];
  list.push({ id: 'cash', name: 'Cash in Hand', group: 'cash', type: 'asset' });
  list.push({ id: 'bank', name: 'Bank / UPI', group: 'cash', type: 'asset' });
  buyers().forEach(p => list.push({ id: 'pt_' + p.id, name: p.name, group: 'debtor', type: 'asset', partyId: p.id, sub: p.area, ptype: p.type }));
  vendors().forEach(p => list.push({ id: 'pt_' + p.id, name: p.name, group: 'creditor', type: 'liability', partyId: p.id, sub: p.area }));
  agents().forEach(a => list.push({ id: 'ag_' + a.id, name: a.name, group: 'agent', type: 'asset', agentId: a.id, sub: a.area }));
  CHANNELS.forEach(c => list.push({ id: 'sales_' + c.id, name: 'Sales — ' + c.label, group: 'income', type: 'income' }));
  list.push({ id: 'purchase', name: 'Purchase (Raw Material)', group: 'expense', type: 'expense' });
  const cats = Array.from(new Set(DB.expenses.map(e => e.category))).sort();
  cats.forEach(c => list.push({ id: EXP_ACC_ID(c), name: c, group: 'expense', type: 'expense' }));
  list.push({ id: 'exp_bad_debt', name: 'Bad Debt / Write-off', group: 'expense', type: 'expense' });
  list.push({ id: 'gst', name: 'GST Payable', group: 'gst', type: 'liability' });
  list.push({ id: 'opening_eq', name: 'Opening Balance B/F', group: 'equity', type: 'equity' });
  return list;
}
const ACCMAP = () => { const m = {}; accountsList().forEach(a => m[a.id] = a); return m; };
const accName = (id, map) => (map && map[id] ? map[id].name : (ACCMAP()[id] || {}).name || id);

/* ---- opening balance (Dr = +, Cr = −) ---- */
function openingBalance(accId) {
  if (accId === 'cash') return num(DB.meta.openingCash);
  if (accId === 'bank') return num(DB.meta.openingBank);
  if (accId.indexOf('pt_') === 0) {
    const p = partyById(accId.slice(3));
    if (!p) return 0;
    return (p.type === 'outlet' || p.type === 'customer') ? num(p.opening) : -num(p.opening);
  }
  if (accId === 'opening_eq') {
    const t = DB.parties.reduce((a, p) => a + (p.type === 'vendor' ? -num(p.opening) : num(p.opening)), 0);
    return -(t + num(DB.meta.openingCash) + num(DB.meta.openingBank));
  }
  return 0;
}

/* ---- journal postings (double entry) ---- */
let _pc = { key: '', data: null };
function postingsAll() {
  const key = [DB.sales.length, DB.purchases.length, DB.expenses.length, DB.payments.length, DB.parties.length, DB.products.length,
    (DB.agentDeposits || []).length, (DB.agents || []).length, (DB.vendorPayments || []).length, (DB.writeOffs || []).length].join('|');
  if (_pc.key === key && _pc.data) return _pc.data;
  const data = buildPostings();
  _pc = { key: key, data: data };
  return data;
}
function buildPostings() {
  const out = [];
  const payAcc = m => (m === 'upi' ? 'bank' : 'cash');
  let n = 0;

  DB.sales.forEach(s => {
    const p = productById(s.productId);
    const party = s.partyId ? partyById(s.partyId) : null;
    const amt = r2(num(s.qty) * num(s.rate));
    const g = num(s.gstPct);
    const taxable = r2(amt / (1 + g / 100));
    const tax = r2(amt - taxable);
    const drAcc = (s.agentId && s.payMode === 'cash') ? 'ag_' + s.agentId
      : s.payMode === 'credit' ? (party ? 'pt_' + party.id : 'cash') : payAcc(s.payMode);
    out.push({
      date: s.date, voucher: 'Sale', ref: s.invNo || '', ord: n++,
      narration: (p ? p.name : '-') + ' · ' + QTY(s.qty) + ' × ' + INR(s.rate) + (party ? ' · ' + party.name : ''),
      lines: [{ acc: drAcc, dr: amt }, { acc: 'sales_' + s.channel, cr: taxable }, { acc: 'gst', cr: tax }]
    });
  });

  DB.purchases.forEach(pu => {
    const party = pu.partyId ? partyById(pu.partyId) : null;
    const total = r2(num(pu.amount)), paid = r2(num(pu.paidAmount));
    const lines = [{ acc: 'purchase', dr: total }];
    if (Math.abs(paid) > 0.005) lines.push(paid > 0 ? { acc: payAcc(pu.payMode), cr: paid } : { acc: payAcc(pu.payMode), dr: -paid });
    const unpaid = r2(total - paid);
    if (Math.abs(unpaid) > 0.005) lines.push(unpaid > 0 ? { acc: party ? 'pt_' + party.id : 'cash', cr: unpaid } : { acc: party ? 'pt_' + party.id : 'cash', dr: -unpaid });
    out.push({
      date: pu.date, voucher: 'Purchase', ref: '', ord: n++,
      narration: (pu.lines || []).map(l => (ingById(l.ingId) || {}).name + ' ' + QTY(l.qty)).join(', ') + (party ? ' · ' + party.name : ''),
      lines: lines
    });
  });

  DB.expenses.forEach(e => {
    out.push({
      date: e.date, voucher: 'Expense', ref: e.vertical ? VLABEL[e.vertical] : '', ord: n++,
      narration: e.category + (e.note ? ' · ' + e.note : ''),
      lines: [{ acc: EXP_ACC_ID(e.category), dr: r2(num(e.amount)) }, { acc: 'cash', cr: r2(num(e.amount)) }]
    });
  });

  (DB.writeOffs || []).forEach(w => {
    const p = partyById(w.partyId);
    out.push({
      date: w.date, voucher: 'Write-off', ref: '', ord: n++,
      narration: 'Bad debt · ' + (p ? p.name : '') + (w.note ? ' · ' + w.note : ''),
      lines: [{ acc: 'exp_bad_debt', dr: r2(num(w.amount)) }, { acc: p ? 'pt_' + p.id : 'cash', cr: r2(num(w.amount)) }]
    });
  });

  (DB.vendorPayments || []).forEach(v => {
    const p = partyById(v.partyId);
    out.push({
      date: v.date, voucher: 'Vendor Pay', ref: v.mode === 'upi' ? 'UPI' : 'Cash', ord: n++,
      narration: 'Vendor ko payment · ' + (p ? p.name : '') + (v.note ? ' · ' + v.note : ''),
      lines: [{ acc: p ? 'pt_' + p.id : 'cash', dr: r2(num(v.amount)) }, { acc: payAcc(v.mode), cr: r2(num(v.amount)) }]
    });
  });

  DB.payments.forEach(x => {
    const p = partyById(x.partyId);
    out.push({
      date: x.date, voucher: 'Receipt', ref: x.mode === 'upi' ? 'UPI' : 'Cash', ord: n++,
      narration: (p ? p.name : 'Party') + ' se payment' + (x.note ? ' · ' + x.note : ''),
      lines: [{ acc: payAcc(x.mode), dr: r2(num(x.amount)) }, { acc: p ? 'pt_' + p.id : 'cash', cr: r2(num(x.amount)) }]
    });
  });

  (DB.agentDeposits || []).forEach(dp => {
    const a = (DB.agents || []).find(x => x.id === dp.agentId);
    out.push({
      date: dp.date, voucher: 'Deposit', ref: dp.mode === 'upi' ? 'UPI' : 'Cash', ord: n++,
      narration: (a ? a.name : 'Agent') + ' ne cash jama kiya' + (dp.note ? ' · ' + dp.note : ''),
      lines: [{ acc: payAcc(dp.mode), dr: r2(num(dp.amount)) }, { acc: a ? 'ag_' + a.id : 'cash', cr: r2(num(dp.amount)) }]
    });
  });

  return out.sort((a, b) => a.date < b.date ? -1 : (a.date > b.date ? 1 : a.ord - b.ord));
}

/* ---- ek account ka pura ledger (opening + rows + closing) ---- */
function accountLedger(accId) {
  const map = ACCMAP();
  const opening = openingBalance(accId);
  let bal = opening;
  const rows = [];
  postingsAll().forEach(po => {
    po.lines.forEach((l, i) => {
      if (l.acc !== accId) return;
      const dr = num(l.dr), cr = num(l.cr);
      if (!dr && !cr) return;
      bal += dr - cr;
      const contra = po.lines.filter((x, j) => j !== i && !(x.acc === 'gst' && !num(x.cr)))
        .map(x => accName(x.acc, map)).join(' + ');
      rows.push({ date: po.date, voucher: po.voucher, ref: po.ref, contra: contra, narration: po.narration, dr: dr, cr: cr, bal: r2(bal) });
    });
  });
  return { opening: opening, rows: rows, closing: r2(bal), totalDr: r2(rows.reduce((a, r) => a + r.dr, 0)), totalCr: r2(rows.reduce((a, r) => a + r.cr, 0)) };
}

/* ---- as-on balance sab accounts ka ---- */
function balancesAsOn(asOn) {
  const map = {};
  accountsList().forEach(a => map[a.id] = openingBalance(a.id));
  postingsAll().forEach(po => {
    if (asOn && po.date > asOn) return;
    po.lines.forEach(l => { map[l.acc] = (map[l.acc] || 0) + num(l.dr) - num(l.cr); });
  });
  return map;
}

const drCr = (v, withWord) => {
  const n = r2(v);
  const w = withWord ? '<span class="drcr-tag">' + (n >= 0 ? 'Dr' : 'Cr') + '</span>' : '';
  return (n < 0 ? '-' : '') + INR(Math.abs(n)) + w;
};

/* ================= VIEW: BAHI KHATA ================= */
function viewBahiKhata() {
  const accs = accountsList();
  if (!accs.find(a => a.id === BK.acc)) BK.acc = 'cash';
  const acc = accs.find(a => a.id === BK.acc);
  const balMap = balancesAsOn(P.to);
  const lg = accountLedger(BK.acc);

  /* period ke hisaab se filter */
  const openingForPeriod = (function () {
    let o = lg.opening;
    lg.rows.forEach(r => { if (r.date < P.from) o = r.bal; });
    return o;
  })();
  const rows = lg.rows.filter(r => r.date >= P.from && r.date <= P.to);
  const totDr = rows.reduce((a, r) => a + r.dr, 0);
  const totCr = rows.reduce((a, r) => a + r.cr, 0);
  const closing = r2(openingForPeriod + totDr - totCr);

  const groups = ['cash', 'debtor', 'agent', 'creditor', 'income', 'expense', 'gst'];
  const listHTML = groups.map(g => {
    const items = accs.filter(a => a.group === g);
    if (!items.length) return '';
    return '<div class="bk-group">' + GROUP_LABEL[g] + '</div>' + items.map(a => {
      const b = r2(balMap[a.id] || 0);
      const show = Math.abs(b) > 0.004 || ['cash', 'bank'].indexOf(a.id) > -1;
      return '<button class="acct' + (a.id === BK.acc ? ' active' : '') + '" data-act="bkSelect" data-acc="' + a.id + '" data-name="' + esc(a.name).toLowerCase() + '">' +
        '<span class="acct-name">' + esc(a.name) + '</span>' +
        (show ? '<span class="acct-bal">' + INR0(Math.abs(b)) + ' ' + (b >= 0 ? 'Dr' : 'Cr') + '</span>' : '') +
        '</button>';
    }).join('');
  }).join('');

  const ledgerRows = rows.map(r =>
    '<tr><td>' + dmyShort(r.date) + '<div class="tiny muted">' + weekday(r.date) + '</div></td>' +
    '<td>' + esc(r.contra || '—') + '<div class="tiny muted">' + esc(r.narration) + '</div></td>' +
    '<td><span class="badge b-grey">' + esc(r.voucher) + '</span>' + (r.ref ? ' <span class="tiny mono muted">' + esc(r.ref) + '</span>' : '') + '</td>' +
    '<td class="drcr">' + (r.dr ? INR(r.dr) : '<span class="muted">—</span>') + '</td>' +
    '<td class="drcr">' + (r.cr ? INR(r.cr) : '<span class="muted">—</span>') + '</td>' +
    '<td class="drcr">' + drCr(r.bal, true) + '</td></tr>'
  ).join('');

  const ledgerCard =
    '<div class="card" id="ledgerCard">' +
      '<div class="ledger-head">' +
        '<div><h3>' + esc(acc.name) + '</h3>' +
          '<div class="sub">' + (GROUP_LABEL[acc.group] || '') + (acc.sub ? ' · ' + esc(acc.sub) : '') + ' · ' + periodLabel() + '</div></div>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
          (acc.partyId && acc.group === 'debtor' ? '<button class="btn sm" data-act="newPayment" data-party="' + acc.partyId + '">Payment mila</button>' : '') +
          (acc.agentId ? '<button class="btn sm" data-act="agentDeposit" data-id="' + acc.agentId + '">Jama karein</button>' : '') +
          '<button class="btn sm" data-act="printLedger">Print</button>' +
        '</div>' +
      '</div>' +
      '<div class="ledger-sum">' +
        '<div><span>Opening</span><b>' + drCr(openingForPeriod, true) + '</b></div>' +
        '<div><span>Total Debit</span><b>' + INR(totDr) + '</b></div>' +
        '<div><span>Total Credit</span><b>' + INR(totCr) + '</b></div>' +

/* ================= ORDERS (marketing supply) ================= */
function orderCalc(o) {
  let totalQty = 0, suppliedQty = 0, value = 0;
  (o.lines || []).forEach(l => {
    const sup = DB.sales.filter(s => s.orderId === o.id && s.productId === l.productId)
      .reduce((a, s) => a + num(s.qty), 0);
    l.supplied = r3(sup);
    totalQty += num(l.qty);
    suppliedQty += Math.min(sup, num(l.qty));
    value += num(l.qty) * num(l.rate);
  });
  const status = o.status === 'cancelled' ? 'cancelled'
    : suppliedQty <= 0.0001 ? 'pending'
      : suppliedQty >= totalQty - 0.0001 ? 'complete' : 'partial';
  return { totalQty: r3(totalQty), suppliedQty: r3(suppliedQty), pending: r3(Math.max(0, totalQty - suppliedQty)), value: r2(value), status: status };
}
const orderBadge = st => st === 'pending' ? '<span class="badge b-amber">Pending</span>'
  : st === 'partial' ? '<span class="badge b-indigo">Partial</span>'
    : st === 'complete' ? '<span class="badge b-green">Complete</span>' : '<span class="badge b-grey">Cancel</span>';

function viewOrderBook() {
  const all = (DB.orders || []).slice().sort((a, b) => a.date < b.date ? 1 : -1);
  const rows = all.map(o => ({ o: o, c: orderCalc(o) }));
  const open = rows.filter(r => r.c.status === 'pending' || r.c.status === 'partial');
  const pendQty = open.reduce((a, r) => a + r.c.pending, 0);
  const pendVal = open.reduce((a, r) => a + r.c.pending * (r.c.value / Math.max(1, r.c.totalQty)), 0);
  const inPeriod = rows.filter(r => r.o.date >= P.from && r.o.date <= P.to);
  const periodVal = inPeriod.reduce((a, r) => a + r.c.value, 0);

  return pageHead('Orders', 'Order mila → yahan daalein → supply karne par bill ban jayega',
      '<button class="btn primary" data-act="newOrder">+ Naya Order</button>') +
    '<div class="kpis mb">' +

/* ================= DEMAND ================= */
function viewDemand() {
  const prevDays = Math.max(1, daysBetween(P.from, P.to) + 1);
  const prevTo = addDays(P.from, -1), prevFrom = addDays(prevTo, -(prevDays - 1));

  const perParty = {};
  const add = (pid, key, val) => { const m = perParty[pid] || (perParty[pid] = { ordQty: 0, ordVal: 0, supVal: 0, supQty: 0, prevVal: 0 }); m[key] += val; };

  (DB.orders || []).forEach(o => {
    if (o.date < P.from || o.date > P.to) return;
    (o.lines || []).forEach(l => { add(o.partyId, 'ordQty', num(l.qty)); add(o.partyId, 'ordVal', num(l.qty) * num(l.rate)); });
  });
  DB.sales.filter(s => s.channel === 'supply').forEach(s => {
    const v = num(s.qty) * num(s.rate);
    if (s.date >= P.from && s.date <= P.to) { add(s.partyId, 'supVal', v); add(s.partyId, 'supQty', num(s.qty)); }
    else if (s.date >= prevFrom && s.date <= prevTo) add(s.partyId, 'prevVal', v);
  });

  const rows = Object.keys(perParty).map(pid => {
    const m = perParty[pid], p = partyById(pid);
    const demandVal = Math.max(m.ordVal, m.supVal);
    const growth = m.prevVal ? (m.supVal - m.prevVal) / m.prevVal * 100 : 0;
    return { party: p, name: p ? p.name : '—', area: p && p.area, ordQty: m.ordQty, supQty: m.supQty, supVal: m.supVal, ordVal: m.ordVal, demandVal: demandVal, growth: growth, prevVal: m.prevVal };
  }).sort((a, b) => b.demandVal - a.demandVal);
  const maxD = Math.max.apply(null, rows.map(r => r.demandVal).concat([1]));

  /* product wise demand */
  const perProd = {};
  (DB.orders || []).forEach(o => {
    if (o.date < P.from || o.date > P.to) return;
    (o.lines || []).forEach(l => perProd[l.productId] = (perProd[l.productId] || 0) + num(l.qty));
  });
  DB.sales.filter(s => s.channel === 'supply' && s.date >= P.from && s.date <= P.to)
    .forEach(s => perProd[s.productId] = (perProd[s.productId] || 0) + num(s.qty));
  const prodRows = Object.keys(perProd).map(pid => ({ name: (productById(pid) || {}).name || '—', qty: perProd[pid] }))
    .sort((a, b) => b.qty - a.qty).slice(0, 8);
  const maxPQ = Math.max.apply(null, prodRows.map(r => r.qty).concat([1]));

  return pageHead('Demand Analysis', 'Kis party aur kis product ki demand badh rahi hai · ' + periodLabel(),
      '<button class="btn" data-act="printReport" data-title="Demand Analysis">Print</button>') +
    (rows.length ? '' : card('Abhi data nahi', '', '',
      '<div class="empty"><b>Order ya supply entry karein</b>Phir yahan party-wise demand aur trend dikhega.<div style="margin-top:10px">' +
      '<button class="btn primary" data-act="newOrder">+ Naya Order</button></div></div>')) +
    (rows.length ? '<div class="grid cols-2-1">' +
      card('Party wise demand', 'Order + supply ke hisaab se', '',
        tableHTML([
          { label: 'Party', render: r => '<b>' + esc(r.name) + '</b><div class="tiny muted">' + esc(r.area || '') + '</div>' },
          { label: 'Ordered', cls: 'num', render: r => QTY(r.ordQty) },
          { label: 'Supplied', cls: 'num', render: r => QTY(r.supQty) },
          { label: 'Supply Value', cls: 'num', render: r => INR0(r.supVal) },
          { label: 'Trend', cls: 'num', render: r => r.prevVal ? '<span class="badge ' + (r.growth >= 0 ? 'b-green' : 'b-red') + '">' + (r.growth >= 0 ? '▲' : '▼') + ' ' + Math.abs(r.growth).toFixed(0) + '%</span>' : '<span class="muted tiny">naya</span>' },
          { label: 'Demand', render: r => '<div class="bar" style="width:90px"><i style="width:' + (r.demandVal / maxD * 100).toFixed(1) + '%"></i></div>' }
        ], rows, { compact: true }), { tight: true }) +
      card('Kis product ki demand', 'Order + supply qty milakar', '',
        prodRows.map(r => '<div style="margin-bottom:9px"><div style="display:flex;justify-content:space-between;font-size:12.5px"><span>' + esc(r.name) + '</span><b>' + QTY(r.qty) + '</b></div>' +
          '<div class="bar" style="margin-top:3px"><i style="width:' + (r.qty / maxPQ * 100).toFixed(1) + '%"></i></div></div>').join('')) +
      '</div>' : '');
}

/* ================= DAILY REGISTER, REQUIREMENTS & MONTHLY EXPENSES ================= */
let DAY = TODAY;
let EXP_MONTH = monthKey(TODAY);
const addN = (obj, k, v) => { obj[k] = (obj[k] || 0) + v; };

/* ---- pending order qty per product ---- */
function pendingByProduct() {
  const supMap = {};
  DB.sales.forEach(s => { if (s.orderId) supMap[s.orderId + '|' + s.productId] = (supMap[s.orderId + '|' + s.productId] || 0) + num(s.qty); });
  const m = {};
  (DB.orders || []).forEach(o => {
    if (o.status === 'cancelled') return;
    (o.lines || []).forEach(l => {
      const sup = supMap[o.id + '|' + l.productId] || 0;
      const pend = Math.max(0, num(l.qty) - sup);
      if (pend > 0.0001) addN(m, l.productId, pend);
    });
  });
  return m;
}

/* ---- product qty -> ingredient requirement (BOM explosion) ---- */
function ingredientRequirement(prodQty) {
  const req = {};
  Object.keys(prodQty).forEach(pid => {
    const p = productById(pid);
    if (!p || p.costMode === 'purchase') return;
    const yq = Math.max(0.0001, productCost(p).yieldQty);
    const batches = num(prodQty[pid]) / yq;
    (p.recipe && p.recipe.lines || []).forEach(l => addN(req, l.ingId, lineQty(l, p.recipe) * batches));
  });
  return req;
}

/* ---- dual bar chart (order vs supply) ---- */
function dualBars(points) {
  const w = 760, h = 170, pad = { t: 10, r: 6, b: 22, l: 6 };
  if (!points.length) return '<div class="empty" style="padding:20px">Data nahi</div>';
  const max = Math.max.apply(null, points.map(p => Math.max(p.a, p.b)).concat([1]));
  const iw = (w - pad.l - pad.r) / points.length;
  const bw = Math.max(3, Math.min(11, iw * 0.34));
  let g = '', labels = '';
  points.forEach((p, i) => {
    const x0 = pad.l + i * iw + (iw - bw * 2 - 2) / 2;
    const ha = Math.max(1.5, (h - pad.t - pad.b) * (p.a / max));
    const hb = Math.max(1.5, (h - pad.t - pad.b) * (p.b / max));
    g += '<rect x="' + x0.toFixed(1) + '" y="' + (h - pad.b - ha).toFixed(1) + '" width="' + bw + '" height="' + ha.toFixed(1) + '" rx="2" fill="#c9ccd3"><title>' + esc(p.label) + ' order: ' + INR0(p.a) + '</title></rect>';
    g += '<rect x="' + (x0 + bw + 2).toFixed(1) + '" y="' + (h - pad.b - hb).toFixed(1) + '" width="' + bw + '" height="' + hb.toFixed(1) + '" rx="2" fill="#111827"><title>' + esc(p.label) + ' supply: ' + INR0(p.b) + '</title></rect>';
    if (points.length <= 32 || i % Math.ceil(points.length / 14) === 0) {
      labels += '<text x="' + (x0 + bw).toFixed(1) + '" y="' + (h - 6) + '" font-size="9" fill="#9ca3af" text-anchor="middle">' + esc(p.short || p.label) + '</text>';
    }
  });
  return '<div class="chartbox"><div class="legend" style="margin-bottom:4px"><span><i style="background:#c9ccd3"></i>Order aaya</span><span><i style="background:#111827"></i>Supply kiya</span></div>' +
    '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" style="width:100%;height:' + h + 'px">' +
    '<line x1="0" y1="' + (h - pad.b) + '" x2="' + w + '" y2="' + (h - pad.b) + '" stroke="#e5e7eb"/>' + g + labels + '</svg></div>';
}

/* ================= VIEW: DAILY REGISTER ================= */
function viewDaily() {
  const d = DAY;
  const sales = DB.sales.filter(s => s.date === d);
  const prods = DB.production.filter(p => p.date === d);
  const orders = (DB.orders || []).filter(o => o.date === d);
  const waste = (DB.wastage || []).filter(w => w.date === d);
  const exps = DB.expenses.filter(e => e.date === d);
  const pays = (DB.agentDeposits || []).filter(x => x.date === d);

  const saleAmt = sales.reduce((a, s) => a + num(s.qty) * num(s.rate), 0);
  const supSales = sales.filter(s => s.channel === 'supply');
  const supAmt = supSales.reduce((a, s) => a + num(s.qty) * num(s.rate), 0);
  const orderVal = orders.reduce((a, o) => a + orderCalc(o).value, 0);
  const orderQty = orders.reduce((a, o) => a + orderCalc(o).totalQty, 0);
  const prodQty = prods.reduce((a, p) => a + num(p.qty), 0);
  const prodVal = prods.reduce((a, p) => a + num(p.qty) * productCost(productById(p.productId)).perPc, 0);
  const wasteVal = waste.reduce((a, w) => a + wastageCost(w), 0);
  const cashIn = sales.filter(s => s.payMode === 'cash').reduce((a, s) => a + num(s.qty) * num(s.rate), 0);
  const upiIn = sales.filter(s => s.payMode === 'upi').reduce((a, s) => a + num(s.qty) * num(s.rate), 0);
  const credit = sales.filter(s => s.payMode === 'credit').reduce((a, s) => a + num(s.qty) * num(s.rate), 0);
  const expAmt = exps.reduce((a, e) => a + num(e.amount), 0);

  const orderRows = orders.map(o => ({ o: o, c: orderCalc(o), party: partyById(o.partyId) }));
  const supplyRows = supSales.map(s => ({ s: s, p: productById(s.productId), party: partyById(s.partyId) }));

  /* din-wise register (global period) */
  const dayRows = [];
  for (let x = P.from; x <= P.to; x = addDays(x, 1)) {
    const os = (DB.orders || []).filter(o => o.date === x);
    const ss = DB.sales.filter(s => s.date === x);
    const pp = DB.production.filter(p => p.date === x);
    const ww = (DB.wastage || []).filter(w => w.date === x);
    const ee = DB.expenses.filter(e => e.date === x);
    const oV = os.reduce((a, o) => a + orderCalc(o).value, 0);
    const sV = ss.reduce((a, s) => a + num(s.qty) * num(s.rate), 0);
    if (!os.length && !ss.length && !pp.length && !ee.length && !ww.length) continue;
    dayRows.push({
      date: x, ordCnt: os.length, ordVal: oV, supVal: sV,
      supQty: ss.filter(s => s.channel === 'supply').reduce((a, s) => a + num(s.qty), 0),
      prodQty: pp.reduce((a, p) => a + num(p.qty), 0),
      waste: ww.reduce((a, w) => a + wastageCost(w), 0),
      exp: ee.reduce((a, e) => a + num(e.amount), 0)
    });
  }
  dayRows.reverse();

/* ================= VIEW: KYA CHAHIYE (requirements) ================= */
function viewNeeded() {
  const pend = pendingByProduct();
  const fg = finishedStock();
  const planQty = {};
  const planRows = Object.keys(pend).map(pid => {
    const p = productById(pid) || {};
    const orderQty = pend[pid];
    const stock = Math.max(0, fg[pid] || 0);
    const make = Math.max(0, orderQty - stock);
    if (make > 0) planQty[pid] = make;
    const yq = Math.max(0.0001, productCost(p).yieldQty);
    return { p: p, orderQty: orderQty, stock: stock, make: make, batches: r3(make / yq), cost: productCost(p).perPc * make };
  }).sort((a, b) => b.make - a.make);

  const req = ingredientRequirement(planQty);
  const stockMap = ingredientStock();
  const reqRows = Object.keys(req).map(ingId => {
    const ing = ingById(ingId) || { name: '?', unit: '', rate: 0 };
    const need = req[ingId];
    const have = Math.max(0, stockMap[ingId] || 0);
    const buy = Math.max(0, need - have);
    return { ing: ing, need: need, have: have, buy: buy, cost: buy * num(ing.rate) };
  }).filter(r => r.need > 0.0001).sort((a, b) => (b.buy * num(b.ing.rate)) - (a.buy * num(a.ing.rate)));

  const low = lowStockRows().map(r => ({ r: r, suggest: Math.max(0, r.min * 2 - r.stock), cost: Math.max(0, r.min * 2 - r.stock) * num(r.ing.rate) }));
  const outFG = DB.products.filter(p => Math.max(0, fg[p.id] || 0) <= 0).map(p => {
    const last30 = DB.sales.filter(s => s.productId === p.id && s.date >= addDays(TODAY, -29));
    const avg = last30.reduce((a, s) => a + num(s.qty), 0) / 30;
    return { p: p, avg: avg, suggest: Math.max(1, Math.ceil(avg * 3)) };
  }).filter(r => r.avg > 0);

  const totalBuyCost = reqRows.reduce((a, r) => a + r.cost, 0) + low.reduce((a, r) => a + r.cost, 0);

  return pageHead('Kya Chahiye', 'Pending order pura karne ke liye kya banana hai, kya kharidna hai',
      '<button class="btn" data-act="printReport" data-title="Requirement / Shopping List">Print</button>' +
      '<button class="btn primary" data-act="newPurchase">+ Purchase</button>') +

    '<div class="kpis mb">' +
      tile('Pending Order', QTY(Object.keys(pend).reduce((a, k) => a + pend[k], 0)) + ' pcs', '<span>' + Object.keys(pend).length + ' products</span>', 'amber') +
      tile('Banana Hai', QTY(Object.keys(planQty).reduce((a, k) => a + planQty[k], 0)) + ' pcs', '<span>' + planRows.filter(r => r.make > 0).length + ' products</span>') +
      tile('Kharidna Hai', reqRows.length + ' items', '<span>Approx ' + INR0(totalBuyCost) + '</span>') +
      tile('Low Stock', low.length, '<span>' + (low.length ? 'order karein' : 'sab theek') + '</span>', low.length ? 'red' : 'green') +
    '</div>' +

    card('1. Production Plan — kya banana hai', 'Pending order me se stock ghata kar jo banana hai', '<span class="badge b-grey">' + planRows.filter(r => r.make > 0).length + '</span>',
      tableHTML([
        { label: 'Product', render: r => '<b>' + esc(r.p.name) + '</b>' },
        { label: 'Pending Order', cls: 'num', render: r => QTY(r.orderQty) },
        { label: 'Stock hai', cls: 'num', render: r => QTY(r.stock) },
        { label: 'Banana hai', cls: 'num', render: r => r.make > 0 ? '<b>' + QTY(r.make) + '</b>' : '<span class="pos">pura ho jayega</span>' },
        { label: 'Batches', cls: 'num', render: r => r.make > 0 ? QTY(r.batches) : '—' },
        { label: 'Material Cost', cls: 'num', render: r => r.make > 0 ? INR(r.cost) : '—' },
        { label: '', render: r => r.make > 0 ? '<button class="btn sm" data-act="makeNow" data-id="' + r.p.id + '" data-qty="' + r.make + '">+ Batch</button>' : '' }
      ], planRows, { compact: true, emptyTitle: 'Koi pending order nahi', empty: 'Order aane par yahan production plan banega.' }), { tight: true }) +

    '<div class="mt">' + card('2. Raw Material — kya kharidna hai', 'Production plan ke hisaab se requirement vs stock', '<span class="badge b-grey">' + reqRows.length + '</span>',
      tableHTML([
        { label: 'Ingredient', render: r => '<b>' + esc(r.ing.name) + '</b><div class="tiny muted">' + esc(r.ing.vendor || '') + '</div>' },
        { label: 'Chahiye', cls: 'num', render: r => QTY(r.need) + ' ' + esc(r.ing.unit) },
        { label: 'Stock', cls: 'num', render: r => QTY(r.have) },
        { label: 'Kharidna hai', cls: 'num', render: r => r.buy > 0.0001 ? '<b class="neg">' + QTY(r.buy) + '</b>' : '<span class="pos">hai</span>' },

          { label: 'Item', render: r => '<b>' + esc(r.r.ing.name) + '</b><div class="tiny muted">' + esc(r.r.ing.vendor || '') + '</div>' },
          { label: 'Stock', cls: 'num', render: r => '<span class="' + (r.r.status === 'out' ? 'neg' : '') + '">' + QTY(r.r.stock) + '</span>' },
          { label: 'Min', cls: 'num', render: r => QTY(r.r.min) },

          { label: '', render: r => '<button class="btn sm" data-act="buyNow" data-id="' + r.r.ing.id + '" data-qty="' + r3(r.suggest) + '">Purchase</button>' }
        ], low, { compact: true, emptyTitle: 'Sab stock theek hai 👍' }), { tight: true }) +
      card('4. Finished stock khatam', 'Ye products bikne ke liye nahi hain', '',
        tableHTML([

          { label: 'Avg daily sale', cls: 'num', render: r => QTY(r.avg) },

/* ================= CASH BOOK · PARTY RATE LIST · BATCH / EXPIRY ================= */
let CB_MODE = 'cash';
let RL = '';

/* ---------------------------- 1. CASH BOOK ---------------------------- */
function cashLedger(mode) {
  const ev = [];
  DB.sales.forEach(s => {
    if (s.payMode !== mode) return;
    ev.push({ date: s.date, kind: 'sale', desc: (productById(s.productId) || {}).name || 'Sale', party: (partyById(s.partyId) || {}).name || '', in: r2(num(s.qty) * num(s.rate)), out: 0 });
  });
  DB.purchases.forEach(p => {
    if (p.payMode !== mode) return;
    ev.push({ date: p.date, kind: 'purchase', desc: 'Purchase', party: (partyById(p.partyId) || {}).name || '', in: 0, out: r2(num(p.amount)) });
  });
  if (mode === 'cash') DB.expenses.forEach(e => {
    ev.push({ date: e.date, kind: 'expense', desc: e.category + (e.note ? ' · ' + e.note : ''), party: VLABEL[e.vertical] || '', in: 0, out: r2(num(e.amount)) });
  });
  (DB.payments || []).forEach(p => {
    if (p.mode !== mode) return;
    ev.push({ date: p.date, kind: 'receipt', desc: 'Payment mila' + (p.note ? ' · ' + p.note : ''), party: (partyById(p.partyId) || {}).name || '', in: r2(num(p.amount)), out: 0 });
  });
  (DB.agentDeposits || []).forEach(x => {
    if (x.mode !== mode) return;
    ev.push({ date: x.date, kind: 'deposit', desc: 'Agent paisa jama', party: ((DB.agents || []).find(a => a.id === x.agentId) || {}).name || '', in: r2(num(x.amount)), out: 0 });
  });
  (DB.vendorPayments || []).forEach(x => {
    if (x.mode !== mode) return;
    ev.push({ date: x.date, kind: 'vpay', desc: 'Vendor payment' + (x.note ? ' · ' + x.note : ''), party: (partyById(x.partyId) || {}).name || '', in: 0, out: r2(num(x.amount)) });
  });
  return ev.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
}

function viewCashBook() {
  const mode = CB_MODE;
  const open = mode === 'cash' ? num(DB.meta.openingCash) : num(DB.meta.openingBank);
  const ev = cashLedger(mode);
  const before = ev.filter(e => e.date < P.from);
  let bal = open + before.reduce((a, e) => a + e.in - e.out, 0);
  const openBal = bal;

  const dayRows = [];
  for (let x = P.from; x <= P.to; x = addDays(x, 1)) {
    const list = ev.filter(e => e.date === x);
    const cin = list.reduce((a, e) => a + e.in, 0), cout = list.reduce((a, e) => a + e.out, 0);
    if (!list.length) continue;
    const ob = bal;
    bal = r2(bal + cin - cout);
    dayRows.push({ date: x, ob: ob, cin: cin, cout: cout, cb: bal, n: list.length });
  }
  dayRows.reverse();

  const todayEv = ev.filter(e => e.date === DAY);
  const todayIn = todayEv.reduce((a, e) => a + e.in, 0), todayOut = todayEv.reduce((a, e) => a + e.out, 0);
  const totalIn = dayRows.reduce((a, r) => a + r.cin, 0), totalOut = dayRows.reduce((a, r) => a + r.cout, 0);

  const KIND = { sale: 'Sale', purchase: 'Purchase', expense: 'Kharcha', receipt: 'Payment mila', deposit: 'Agent deposit', vpay: 'Vendor payment' };

/* ---------------------------- 3. BATCH / EXPIRY ---------------------------- */
function batchList() {
  const out = [];
  DB.products.forEach(p => {
    const life = num(p.shelfLife) || 3;
    const bs = DB.production.filter(x => x.productId === p.id).slice()
      .sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
    let consumed = DB.sales.filter(s => s.productId === p.id).reduce((a, s) => a + num(s.qty), 0)
      + (DB.wastage || []).filter(w => w.itemType === 'product' && w.itemId === p.id).reduce((a, w) => a + num(w.qty), 0);
    bs.forEach((b, i) => {
      const qty = num(b.qty);
      const take = Math.min(qty, Math.max(0, consumed));
      consumed -= take;
      out.push({
        p: p, b: b, qty: qty, left: r3(qty - take),
        batchNo: b.batchNo || ('B' + (b.date || '').slice(8, 10) + (b.date || '').slice(5, 7) + '-' + (i + 1)),
        expiry: b.expiry || addDays(b.date, life), life: life
      });
    });
  });
  return out;
}

function viewBatch() {
  const all = batchList();
  const live = all.filter(b => b.left > 0.0001);
  const withDays = live.map(b => Object.assign({}, b, { days: daysBetween(TODAY, b.expiry), value: b.left * productCost(b.p).perPc }));
  const expired = withDays.filter(b => b.days < 0).sort((a, b) => a.expiry < b.expiry ? -1 : 1);
  const soon = withDays.filter(b => b.days >= 0 && b.days <= 2).sort((a, b) => a.expiry < b.expiry ? -1 : 1);
  const fresh = withDays.filter(b => b.days > 2).sort((a, b) => a.expiry < b.expiry ? -1 : 1);
  const risk = expired.concat(soon).reduce((a, b) => a + b.value, 0);
  const noLife = DB.products.filter(p => !num(p.shelfLife)).length;

  const rowBtn = r => '<button class="btn sm danger" data-act="batWaste" data-id="' + r.p.id + '" data-qty="' + r.left + '">Wastage</button>';
  const tbl = (rows, emptyT, emptyS) => tableHTML([
    { label: 'Product', render: r => '<b>' + esc(r.p.name) + '</b><div class="tiny muted">' + esc(r.batchNo) + '</div>' },
    { label: 'Banaya', render: r => dmy(r.b.date) },
    { label: 'Expiry', render: r => '<b>' + dmy(r.expiry) + '</b><div class="tiny muted">' + (r.days < 0 ? Math.abs(r.days) + ' din pehle' : r.days + ' din bache') + '</div>' },
    { label: 'Bacha qty', cls: 'num', render: r => '<b>' + QTY(r.left) + '</b><div class="tiny muted">of ' + QTY(r.qty) + '</div>' },
    { label: 'Value', cls: 'num', render: r => INR(r.value) },
    { label: '', render: rowBtn }
  ], rows, { compact: true, emptyTitle: emptyT, empty: emptyS });

  return pageHead('Batch & Expiry', 'Kaunsa batch kab expire hoga — pehle wala pehle bikna chahiye (FIFO)',
      '<button class="btn" data-act="printReport" data-title="Batch / Expiry">Print</button>' +
      '<button class="btn primary" data-act="newProduction">+ Batch</button>') +

    '<div class="kpis mb">' +
      tile('Live batches', live.length, '<span>' + all.length + ' total made</span>') +
      tile('Expired (stock bacha)', expired.length, '<span>' + INR0(expired.reduce((a, b) => a + b.value, 0)) + ' nuksan</span>', expired.length ? 'red' : 'green') +
      tile('2 din me expire', soon.length, '<span>' + INR0(soon.reduce((a, b) => a + b.value, 0)) + ' value</span>', soon.length ? 'amber' : '') +
      tile('Risk value', INR0(risk), '<span>expire + jaldi expire</span>') +
    '</div>' +

    (expired.length ? card('Expired — turant wastage daalein', 'Ye maal bech nahi sakte, stock me pada hai', '<span class="badge b-red">' + expired.length + '</span>', tbl(expired, '', ''), { tight: true }) + '<div class="mt"></div>' : '') +
    (soon.length ? card('2 din me expire hoga', 'Pehle bech dein ya supply me pehle bhejein', '<span class="badge b-amber">' + soon.length + '</span>', tbl(soon, '', ''), { tight: true }) + '<div class="mt"></div>' : '') +

    (typeof ingAgeingCard === 'function' ? '<div class="mb">' + ingAgeingCard() + '</div>' : '') +
    '<div class="grid cols-2">' +
      card('Fresh stock (batch wise)', 'Sabse pehle expire hone wala sabse upar', '<span class="badge b-grey">' + fresh.length + '</span>',
        tbl(fresh.slice(0, 40), 'Koi fresh batch nahi', 'Production karne par yahan batch-wise stock dikhega.'), { tight: true }) +
      card('Shelf life set karein', 'Product ke hisaab se expiry auto nikalti hai', '',
        !DB.products.length ? '<div class="empty"><b>Pehle product banayein</b>Recipe & Cost me product add karein.</div>' :
        noLife ? '<div class="tiny" style="margin-bottom:8px;color:#b45309">' + noLife + ' product me shelf life nahi bhari — default 3 din maan liya gaya hai.</div>' : '<div class="tiny muted" style="margin-bottom:8px">Sab products me shelf life set hai 👍</div>' +
        tableHTML([
          { label: 'Product', render: p => '<b>' + esc(p.name) + '</b>' },
          { label: 'Shelf life', cls: 'num', render: p => '<b>' + (num(p.shelfLife) || 3) + ' din</b>' },
          { label: '', render: p => '<button class="btn sm" data-act="editProduct" data-id="' + p.id + '">Set</button>' }
        ], DB.products, { compact: true }), { tight: true }) +
    '</div>';
}

  const dates = list.map(s => s.date).sort();
  return { amount: partyBalance(partyId).receivable, oldest: dates[0], bills: list.length };
}

/* ---------------------------- 3. BARCODE (Code 39) ---------------------------- */
const C39 = {
  '0': 'nnnwwnwnn', '1': 'wnnwnnnnw', '2': 'nnwwnnnnw', '3': 'wnwwnnnnn', '4': 'nnnwwnnnw',
  '5': 'wnnwwnnnn', '6': 'nnwwwnnnn', '7': 'nnnwnnwnw', '8': 'wnnwnnwnn', '9': 'nnwwnnwnn',
  'A': 'wnnnnwnnw', 'B': 'nnwnnwnnw', 'C': 'wnwnnwnnn', 'D': 'nnnnwwnnw', 'E': 'wnnnwwnnn',
  'F': 'nnwnwwnnn', 'G': 'nnnnnwwnw', 'H': 'wnnnnwwnn', 'I': 'nnwnnwwnn', 'J': 'nnnnwwwnn',
  'K': 'wnnnnnnww', 'L': 'nnwnnnnww', 'M': 'wnwnnnnwn', 'N': 'nnnnwnnww', 'O': 'wnnnwnnwn',
  'P': 'nnwnwnnwn', 'Q': 'nnnnnnwww', 'R': 'wnnnnnwwn', 'S': 'nnwnnnwwn', 'T': 'nnnnwnwwn',
  'U': 'wwnnnnnnw', 'V': 'nwwnnnnnw', 'W': 'wwwnnnnnn', 'X': 'nwnnwnnnw', 'Y': 'wwnnwnnnn',
  'Z': 'nwwnwnnnn', '-': 'nwnnnnwnw', '.': 'wwnnnnwnn', ' ': 'nwwnnnwnn', '$': 'nwnwnwnnn',
  '/': 'nwnwnnnwn', '+': 'nwnnnwnwn', '%': 'nnnwnwnwn', '*': 'nwnnwnwnn'
};

function barcodeSVG(text, opts) {
  opts = opts || {};
  const h = opts.height || 46, unit = opts.unit || 1.6, quiet = 8;
  const clean = String(text || '').toUpperCase().replace(/[^0-9A-Z\-. $/+%]/g, '');
  if (!clean) return '';
  const chars = ('*' + clean + '*').split('');
  let x = quiet, bars = '';
  chars.forEach((ch, ci) => {
    const pat = C39[ch] || C39['-'];
    for (let i = 0; i < 9; i++) {
      const w = (pat[i] === 'w' ? 3 : 1) * unit;
      if (i % 2 === 0) bars += '<rect x="' + x.toFixed(1) + '" y="0" width="' + w.toFixed(1) + '" height="' + h + '" fill="#111827"/>';
      x += w;
    }
    if (ci < chars.length - 1) x += unit;
  });
  const total = x + quiet;
  return '<div style="text-align:center;margin:8px 0 2px">' +
    '<svg width="' + total.toFixed(0) + '" height="' + h + '" viewBox="0 0 ' + total.toFixed(0) + ' ' + h + '" style="max-width:100%">' + bars + '</svg>' +
    '<div style="font-family:monospace;font-size:11px;letter-spacing:.16em;color:#111">' + esc(clean) + '</div></div>';
}

/* ---------------------------- 4. ATTENDANCE + ADVANCE ---------------------------- */
function attOf(staffId, date) {
  return (DB.attendance || []).find(a => a.staffId === staffId && a.date === date);
}

function attSummary(staffId, month) {
  const s = DB.staff.find(x => x.id === staffId) || {};
  const recs = (DB.attendance || []).filter(a => a.staffId === staffId && monthKey(a.date) === month);
  const P = recs.filter(a => a.status === 'P').length;
  const A = recs.filter(a => a.status === 'A').length;
  const H = recs.filter(a => a.status === 'H').length;
  const L = recs.filter(a => a.status === 'L').length;
  const ot = recs.reduce((x, a) => x + num(a.ot), 0);
  const hasAtt = recs.length > 0;
  const days = hasAtt ? (P + L + H * 0.5) : (s.payType === 'monthly' ? 26 : num(s.daysPresent));
  const baseRate = num(s.rate);
  const perDay = s.payType === 'monthly' ? baseRate / 26 : baseRate;
  const earned = r2(perDay * Math.min(days, 31));
  const otRate = r2(perDay / 8);
  const otAmt = r2(ot * otRate);
  const adv = r2((DB.advances || []).filter(a => a.staffId === staffId && monthKey(a.date) === month).reduce((x, a) => x + num(a.amount), 0));
  const paid = r2((DB.salaryPaid || []).filter(x => x.staffId === staffId && x.month === month).reduce((x, p) => x + num(p.amount), 0));
  const rawPay = r2(earned + otAmt - adv - paid);
  return { s: s, P: P, A: A, H: H, L: L, ot: ot, days: days, perDay: perDay, earned: earned, otAmt: otAmt, adv: adv, paid: paid, payable: Math.abs(rawPay) < 1 ? 0 : rawPay, hasAtt: hasAtt };
}

/* ---------------------------- 1. BACKUP + AUTO SNAPSHOT ---------------------------- */
const SNAP_PREFIX = 'ds_snap_';
const SNAP_LAST = 'ds_snap_last';

function dbHasData() { return (DB.sales.length + DB.products.length + DB.expenses.length) > 0; }

function backupAgeDays() {
  const lb = DB.settings && DB.settings.lastBackup;
  return lb ? daysSince(lb) : null;
}

function snapKeys() {
  const out = [];
  try {
    for (let i = 0; i < LS.length; i++) {
      const k = LS.key(i);
      if (k && k.indexOf(SNAP_PREFIX) === 0 && k !== SNAP_LAST) out.push(k);
    }
  } catch (e) { for (const k in LS) { if (k.indexOf(SNAP_PREFIX) === 0 && k !== SNAP_LAST) out.push(k); } }
  return out.sort().reverse();
}

function autoSnapshot(force) {
  try {
    if (!dbHasData()) return;
    const last = LS.getItem(SNAP_LAST);
    if (!force && last && daysSince(last) < 3) return;
    const json = JSON.stringify(DB);
    if (json.length > 3000000) return;
    LS.setItem(SNAP_PREFIX + TODAY, json);
    LS.setItem(SNAP_LAST, TODAY);
    const keys = snapKeys();
    keys.slice(3).forEach(k => { try { LS.removeItem(k); } catch (e) {} });
  } catch (e) {}
}

function restoreSnapshot(key) {
  try {
    const raw = LS.getItem(key);
    if (!raw) { toast('Snapshot nahi mila', 'err'); return; }
    confirmBox('Is snapshot se data restore karein? (' + key.replace(SNAP_PREFIX, '') + ') — abhi ka data badal jayega.', () => {
      const d = JSON.parse(raw);
      if (!d || !d.meta) { toast('Snapshot kharab hai', 'err'); return; }
      DB = d;
      if (!DB.settings) DB.settings = { gstOn: 1 };
      saveDB();
      toast('Snapshot restore ho gaya', 'ok');
      render();
    }, 'Restore karein');
  } catch (e) { toast('Restore fail: ' + e.message, 'err'); }
}

function backupShare() {
  const json = JSON.stringify(DB, null, 1);
  DB.settings.lastBackup = TODAY; saveDB();
  autoSnapshot(true);
  const fname = 'dream-sandwich-backup-' + TODAY + '.json';
  try {
    const file = new File([json], fname, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: 'Dream Sandwich backup ' + TODAY }).catch(() => {});
      return;
    }
  } catch (e) {}
  if (json.length > 60000) { toast('File bada hai — download karke WhatsApp me bhejein', 'warn'); backupDownload(); return; }
  copyBox('Backup — WhatsApp me bhejein (file nahi, text)', json);
}

function backupBanner() {
  if (!dbHasData()) return '';
  const age = backupAgeDays();
  if (age !== null && age < 7) return '';
  if (DB.settings.snoozeBackup && daysSince(DB.settings.snoozeBackup) < 3) return '';
  const title = age === null ? 'Backup abhi tak nahi liya' : ('Backup ' + age + ' din se nahi liya');
  return '<div class="card" style="margin-bottom:14px;border-left:3px solid #c2872e">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">' +
      '<div><div style="font-weight:800;font-size:14px">⚠️ ' + title + '</div><div class="tiny muted">Browser data clear hone par sab chala jayega. Ek click me backup lein — file download + auto snapshot.</div></div>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap">' +
        '<button class="btn primary" data-act="backupNow">⬇ Backup file</button>' +
        '<button class="btn" data-act="backupShare">📤 Share / WhatsApp</button>' +
        '<button class="btn" data-act="backupLater">Baad me</button>' +

function nextPONo() {
  const fy = DB.meta.fy || fyOf(TODAY);
  const list = (DB.purchaseOrders || []).filter(p => String(p.no || '').indexOf('PO/' + fy) === 0);
  return 'PO/' + fy + '/' + String(list.length + 1).padStart(4, '0');
}

function poCalc(po) {
  const recs = DB.purchases.filter(p => p.poId === po.id);
  let totalQty = 0, recvQty = 0, value = 0, recvVal = 0;
  (po.lines || []).forEach(l => {
    const q = num(l.qty), r = num(l.rate);
    const got = recs.reduce((a, p) => a + (p.lines || []).filter(x => x.ingId === l.ingId).reduce((b, x) => b + num(x.qty), 0), 0);
    l.received = r3(got);
    totalQty += q; value += q * r;
    recvQty += Math.min(got, q); recvVal += Math.min(got, q) * r;
  });
  const status = recvQty <= 0.0001 ? 'open' : (recvQty >= totalQty - 0.0001 ? 'complete' : 'partial');
  return { totalQty: r3(totalQty), recvQty: r3(recvQty), pending: r3(Math.max(0, totalQty - recvQty)), value: r2(value), recvVal: r2(recvVal), status: status, bills: recs.length };
}

function poBadge(st) {
  return st === 'complete' ? '<span class="badge b-green">Received</span>'
    : st === 'partial' ? '<span class="badge b-amber">Partial</span>'

}

    DB.purchaseOrders = (DB.purchaseOrders || []).filter(x => x.id !== d.id);
    saveDB(); render(); toast('PO delete', 'ok');
  }),
  poFromNeeded: () => {
    const pend = pendingByProduct();
    const req = ingredientRequirement(pend);
    const stock = ingredientStock();
    const need = {};
    Object.keys(req).forEach(k => { const buy = req[k] - (stock[k] || 0); if (buy > 0.0001) need[k] = r3(buy); });
    if (!Object.keys(need).length) { toast('Abhi kuch kharidna nahi hai', 'warn'); return; }
    const byVendor = {};
    Object.keys(need).forEach(ingId => {
      const ing = ingById(ingId) || {};
      const vendor = vendors().find(v => v.name === ing.vendor) || vendors()[0];
      const key = vendor ? vendor.id : 'none';
      byVendor[key] = byVendor[key] || [];
      byVendor[key].push({ ingId: ingId, qty: need[ingId], rate: num(ing.rate) });
    });
    const count = Object.keys(byVendor).length;
    confirmBox('Pending order ki requirement se ' + count + ' vendor ke PO banayein?', () => {
      if (!DB.purchaseOrders) DB.purchaseOrders = [];
      Object.keys(byVendor).forEach(vid => {
        DB.purchaseOrders.push({
          id: uid('po'), no: nextPONo(), date: TODAY, vendorId: vid === 'none' ? (vendors()[0] || {}).id : vid,
          lines: byVendor[vid], note: 'Kya chahiye se auto PO'
        });
      });
      saveDB(); render();
      toast(count + ' PO ban gaye', 'ok');
    }, 'PO banayein');
  }
});
/* ================= BARCODE SCAN → BILL ME ITEM ================= */
let SCAN_FOCUS = false;

const prodCode = p => String((p && (p.barcode || p.id)) || '').trim().toUpperCase();

function findProductByCode(code) {
  const c = String(code || '').trim().toUpperCase();
  if (!c) return null;
  let hit = DB.products.find(p => prodCode(p) === c);
  if (hit) return hit;
  hit = DB.products.find(p => String(p.id).toUpperCase() === c);
  if (hit) return hit;
  hit = DB.products.find(p => String(p.name).toUpperCase().indexOf(c) === 0);
  if (hit) return hit;
  hit = DB.products.find(p => String(p.name).toUpperCase().indexOf(c) > -1);
  return hit || null;
}

/* sale form me item add / qty +1 */
function scanAddItem(code) {
  if (typeof SCAN_FOCUS === 'undefined') SCAN_FOCUS = false;
  if (typeof readSaleForm === 'function') readSaleForm();
  const p = findProductByCode(code);
  if (!p) { toast('Code nahi mila: ' + code, 'err'); SCAN_FOCUS = true; if (typeof drawSale === 'function') drawSale(); return false; }
  const line = SL.lines.find(l => l.productId === p.id);
  if (line) line.qty = String(r3(num(line.qty) + 1));
  else SL.lines.push({ productId: p.id, qty: '1', rate: partyRate(SL.partyId, p, SL.channel), discPct: 0 });
  SCAN_FOCUS = true;
  if (typeof drawSale === 'function') drawSale();
  toast(p.name + ' added', 'ok');
  return true;
}
